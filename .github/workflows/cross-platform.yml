      - name: Resource editor auto 3rd
        run: zig build resource-editor-auto-3rd -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
      - name: Resource editor auto 3rv
        run: zig build resource-editor-auto-3rv -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
      - name: Resource editor auto mip
        run: zig build resource-editor-auto-mip -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
      - name: Resource editor auto chc
        run: zig build resource-editor-auto-chc -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
      - name: Resource editor auto cgc
        run: zig build resource-editor-auto-cgc -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
      - name: Resource editor auto mdc
        run: zig build resource-editor-auto-mdc -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
      - name: Resource editor auto gui
        run: zig build resource-editor-auto-gui -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # T-03-14-03: the packaged MapEditor.exe opens no console on a normal
      # double-click (configureMapEditorExecutable's .windows subsystem) -
      # confirmed by reading its own PE header rather than trusting the build
      # config alone. e_lfanew (the PE signature's offset) sits at DOS header
      # offset 0x3C; the Subsystem WORD sits 0x44 into the Optional Header,
      # which itself starts right after the 4-byte PE signature and the
      # 20-byte COFF header, i.e. at e_lfanew + 0x5C. 2 is
      # IMAGE_SUBSYSTEM_WINDOWS_GUI (winnt.h) - the map-editor-host-check step
      # above already built and staged this exact binary.
      - name: Map editor is a GUI program
        shell: pwsh
        run: |
          $exePath = "zig-out/game/windows/x86_64/debug/MapEditor.exe"
          if (-not (Test-Path $exePath)) { throw "staged MapEditor.exe not found at $exePath" }
          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          $eLfanew = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystemOffset = $eLfanew + 0x5C
          $subsystem = [BitConverter]::ToUInt16($bytes, $subsystemOffset)
          Write-Host "MapEditor.exe subsystem: $subsystem (2 = IMAGE_SUBSYSTEM_WINDOWS_GUI)"
          if ($subsystem -ne 2) { throw "MapEditor.exe subsystem is $subsystem, expected 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI)" }

      # The editor core driving the real engine through the Zig adapter.
      - name: Map editor engine tier
        run: zig build test-map-editor-engine -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # The scripted editor scenarios (05-REVIEW WR-D05): BK_EDITOR_AUTO's M1, M2
      # and M3 scripts, one after the other (each step depends on the one before,
      # so two engines never start at once), with their do=/expect= predicates.
      - name: Map editor scenarios
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build map-editor-m3-auto -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # The real Game playing what the editor saved: M1's placed unit, M2's
      # BK_MAP_TRACE report, and M3's railroad with fewer than two control
      # points (D-33, the CRailroadGraphConstructor crash) - its regression gate.
      - name: Game reads the editor's maps
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build map-editor-game-reads-it-m3 -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Game reads the Resource Editor's exports
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-game-reads-it -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Random missions tier
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-windows-msvc --release=fast -Dtest-mode=run -Drandom-missions-sweep=all "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # The map editor's composers (05-09, 05-10): every shipped template, graph,
      # container and field set read, written and read again through the editor's
      # own records and compared (bytes included), and an authored set generated
      # from twice with one seed and compared byte for byte.
      - name: RMG composer round trip
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-rmg-composer-roundtrip -Dtarget=x86_64-windows-msvc --release=fast -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: RMG determinism
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-rmg-determinism -Dtarget=x86_64-windows-msvc --release=fast -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        run: zig build test-resource-model -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # Saved here, not at job end: by now the debug engine and the release
      # game are built, and a job cut off later still leaves the next run warm.
      - name: Save Zig build cache
        if: always() && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}

      - name: Save Windows Zig global cache
        if: always() && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~\AppData\Local\zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}

      # Debug-only: NI_ASSERT lives in the debug build alone (RC2's
      # SRMMiniMapCreateParameter guard). kharkov42 selects its chapter's
      # four summer_ukraine templates (defend00, defend01, escort00, hunt00)
      # at three difficulties, 12 cases, so the assert runs on the revived
      # mission types without paying for a debug `all` sweep (about 3 h; see
      # Task 5's report). only=summer_ukraine would also match the
      # summer_ukraine\securearea* template paths (setting summer_russia),
      # about 96 cases.
      - name: Random missions tier (debug asserts)
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-windows-msvc -Dtest-mode=run -Drandom-missions-sweep=only=kharkov42 "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Build the Map Editor overlay spike
        run: zig build editor-overlay-spike-build -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run GFX GPU factory test
        run: zig build gfxgpu-factory-test -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # The Windows package, built for real: until 03-16 no job ran any package
      # step (03-VERIFICATION.md). Last, after the mid-job cache saves, so a
      # slow package run never costs the next run its warm cache. It stages a
      # second copy of the checked-out Data and writes two stored zips
      # (package-game-editors builds Blitzkrieg-game.zip on the way), so the
      # free space is printed first.
      - name: Package the game with the editors
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free / 1GB, 1)}}, @{n='UsedGB';e={[math]::Round($_.Used / 1GB, 1)}}
          zig build package-game-editors -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The variant that ships. The debug package above never caught that the
      # package stage-game runs were not ordered after game-all: a release
      # package on a fresh Windows tree raced the installs and failed in
      # copyGameRuntime with FileNotFound (03-16 SUMMARY, release packaging).
      # The release engine is already built by the random missions tier, so
      # this adds the release MapEditor and the staging and zipping.
      - name: Package the release game with the editors
        run: |
          zig build package-game-editors -Dtarget=x86_64-windows-msvc --release=fast "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # D-08: MapEditor.exe sits beside Game.exe at the package root, with the
      # generated SeasonData and the legacy Editors, and no repository mods/.
      # The zip format counts entries in 16 bits and package.zig refuses more
      # than 65,535 (Data alone is 63,809 files), so the count is printed and
      # checked too. The release zips have to carry the Game.exe the release
      # build just installed, not one an earlier build left in zig-out/bin.
      # The package outputs are deleted afterwards: zig-out is uploaded below,
      # and they are four more copies of Data.
      - name: Check the Windows packages
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $releaseGame = (Get-Item "zig-out/bin/Game.exe").Length
          try {
            foreach ($variant in @("debug", "release")) {
              $packages = "zig-out/packages/windows/x86_64/$variant"
              foreach ($zipName in @("Blitzkrieg-game.zip", "Blitzkrieg-game-with-editors.zip")) {
                $zipPath = Join-Path $packages $zipName
                if (-not (Test-Path $zipPath)) { throw "$zipName was not written to $packages" }
                $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
                try {
                  $names = @($zip.Entries | ForEach-Object { $_.FullName })
                  $sizeGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 2)
                  Write-Host "${variant}/${zipName}: $($names.Count) entries, $sizeGB GB"
                  if ($names.Count -gt 65535) { throw "${variant}/${zipName} has $($names.Count) entries, more than a zip without Zip64 can count" }
                  foreach ($required in @("Game.exe", "MapEditor.exe")) {
                    if ($names -notcontains $required) { throw "${variant}/${zipName} has no $required at its root" }
                  }
                  $game = ($zip.Entries | Where-Object { $_.FullName -eq "Game.exe" }).Length
                  Write-Host "  Game.exe: $game bytes (zig-out/bin/Game.exe of the release build: $releaseGame)"
                  if ($variant -eq "release" -and $game -ne $releaseGame) { throw "${variant}/${zipName} carries a Game.exe the release build did not install" }
                  if ($variant -eq "debug" -and $game -eq $releaseGame) { throw "${variant}/${zipName} carries the release Game.exe" }
                  $seasonData = @($names | Where-Object { $_ -like "SeasonData/*" })
                  if ($seasonData.Count -eq 0) { throw "${variant}/${zipName} has no SeasonData/" }
                  Write-Host "  SeasonData: $($seasonData -join ', ')"
                  if (@($names | Where-Object { $_ -like "mods/*" }).Count -ne 0) { throw "${variant}/${zipName} has a top-level mods/" }
                  $editors = @($names | Where-Object { $_ -like "Editors/*" })
                  if ($zipName -eq "Blitzkrieg-game-with-editors.zip") {
                    if ($editors.Count -eq 0) { throw "${variant}/${zipName} has no Editors/" }
                    Write-Host "  Editors: $($editors -join ', ')"
                  } elseif ($editors.Count -ne 0) {
                    throw "${variant}/${zipName} has Editors/ entries: $($editors -join ', ')"
                  }
                } finally {
                  $zip.Dispose()
                }
              }
            }
          } finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "zig-out/packages", "zig-out/game/windows/x86_64/debug/package", "zig-out/game/windows/x86_64/release/package"
          }

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-platform-outputs
          path: zig-out
          if-no-files-found: ignore

  macos-platform:
    # The standard macOS 14 runner is Apple Silicon. Keep this explicit so
    # native module tests cannot silently run on an Intel host.
    runs-on: macos-14
    # Raised for the engine tier: it builds the whole game and the shadercross
    # tool on top of everything else. Measured on run 35639094606 - the tier
    # step alone took 38 minutes on macos-14 and the job finished in 43 of its
    # 45; windows-latest was still building when it hit 60 and was cancelled.
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/movies/progress/
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          zig_host_arch="$(uname -m)"
          case "$zig_host_arch" in
            arm64) zig_host_arch="aarch64" ;;
            x86_64) zig_host_arch="x86_64" ;;
            *) echo "Unsupported macOS host architecture: $zig_host_arch" >&2; exit 1 ;;
          esac
          zig_archive="zig-${zig_host_arch}-macos-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.16.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-${zig_host_arch}-macos-0.16.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Restore Zig build cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-aarch64-macos-zig-build-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-macos-zig-build-0.16.0-

      - name: Restore Unix Zig global cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-aarch64-macos-zig-global-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-macos-zig-global-0.16.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Configure macOS SDK sysroot
        run: echo "MACOS_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Compile StreamIO filesystem tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-files -Dtarget=aarch64-macos -Dtest-mode=compile

      - name: Run runtime module contract tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-modules -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Compile platform foundation matrix
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-foundation -Dtarget=aarch64-macos -Dtest-mode=compile

      - name: Verify native runtime layout
        run: zig build --sysroot "$MACOS_SYSROOT" verify-runtime -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Run native staging tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-stage -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Run diagnostics facade tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-debug -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Run GFX GPU effect table tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-gfxgpu-core -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Map file tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-map-files -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Editor core tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-editor-core -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Editor kit tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-editor-kit -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor core tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-core -Dtarget=aarch64-macos -Dtest-mode=run

      # The app's own unit tests (see the Windows job's step of this name).
      - name: Map editor unit tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-map-editor-view test-map-editor-panels test-map-editor-testlaunch test-map-editor-auto -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Engine tier
        env:
          # This job has a video driver and a GPU device (the probe step below), so a tool that
          # would print "skipped" and exit 0 fails instead, here and in the engine-hosted steps after it.
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" test-editor-bridge -Dtarget=aarch64-macos -Dtest-mode=run

      # S04 slice gate: the resource bridge through the engine, including the
      # preview captures (mesh, sprite, effect) measured by code.
      - name: Resource bridge tier
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-bridge -Dtarget=aarch64-macos -Dtest-mode=run

      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-mod-roundtrip -Dtarget=aarch64-macos -Dtest-mode=run

      # MapEditor itself: the engine started hidden with ImGui over it, one
      # frame captured as presented and checked for both.
      - name: Map editor host
        run: zig build --sysroot "$MACOS_SYSROOT" map-editor-host-check -Dtarget=aarch64-macos -Dtest-mode=run

      # MapEditor's interactive loop, hidden, driven by scripted SDL events:
      # paint, place, select, drag, turn, delete, undo it all, save, reopen.
      - name: Map editor smoke
        run: zig build --sysroot "$MACOS_SYSROOT" map-editor-smoke -Dtarget=aarch64-macos -Dtest-mode=run

      # S05 slice gate: ResourceEditor installs beside Game and MapEditor.
      - name: Resource editor install
        run: zig build --sysroot "$MACOS_SYSROOT" install-resource-editor -Dtarget=aarch64-macos

      # ResourceEditor itself: the engine hidden with ImGui over it, a frame
      # and a thumbnail measured by code; then its scripted new/save/reopen and
      # edit/undo/save byte-compare; then BK_EDITOR_AUTO's scenario over the
      # resource command registry (new, open, edit, undo, save, pack, import,
      # Run Blitzkrieg). A host with no GPU device logs the skip and passes.
      - name: Resource editor host
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-host-check -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor smoke
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-smoke -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor batch
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-batch -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto core
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-core -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto wpn
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-wpn -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto unt
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-unt -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto spt
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-spt -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto msh
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-msh -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto obt
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-obt -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto fnc
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-fnc -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto bld
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-bld -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto bdg
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-bdg -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto pcp
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-pcp -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Resource editor auto eff
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-eff -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto til
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-til -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto 3rd
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-3rd -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto 3rv
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-3rv -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto mip
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-mip -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto chc
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-chc -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto cgc
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-cgc -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto mdc
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-mdc -Dtarget=aarch64-macos -Dtest-mode=run
      - name: Resource editor auto gui
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-auto-gui -Dtarget=aarch64-macos -Dtest-mode=run

      # The game's SDL event translation, through the real SDLApplication and
      # a real window: wheel deltas (a trackpad swipe's fractions, flipped,
      # finger-marked), keys, text and timestamps. Needs a video driver.
      - name: SDL event translation
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-events -Dtarget=aarch64-macos -Dtest-mode=run

      # The editor core driving the real engine through the Zig adapter.
      - name: Map editor engine tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-map-editor-engine -Dtarget=aarch64-macos -Dtest-mode=run

      # The scripted editor scenarios (05-REVIEW WR-D05): BK_EDITOR_AUTO's M1, M2
      # and M3 scripts, one after the other (each step depends on the one before,
      # so two engines never start at once), with their do=/expect= predicates.
      - name: Map editor scenarios
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" map-editor-m3-auto -Dtarget=aarch64-macos -Dtest-mode=run

      # The real Game playing what the editor saved: M1's placed unit, M2's
      # BK_MAP_TRACE report, and M3's railroad with fewer than two control
      # points (D-33, the CRailroadGraphConstructor crash) - its regression gate.
      - name: Game reads the editor's maps
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" map-editor-game-reads-it-m3 -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Game reads the Resource Editor's exports
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" resource-editor-game-reads-it -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Random missions tier
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" test-random-missions -Dtarget=aarch64-macos --release=fast -Dtest-mode=run -Drandom-missions-sweep=all

      - name: RMG composer round trip
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" test-rmg-composer-roundtrip -Dtarget=aarch64-macos --release=fast -Dtest-mode=run

      - name: RMG determinism
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build --sysroot "$MACOS_SYSROOT" test-rmg-determinism -Dtarget=aarch64-macos --release=fast -Dtest-mode=run

      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-model -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Build the Map Editor overlay spike
        run: zig build --sysroot "$MACOS_SYSROOT" editor-overlay-spike-build -Dtarget=aarch64-macos

      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build --sysroot "$MACOS_SYSROOT" gpu-device-probe -Dtarget=aarch64-macos

      - name: Run GFX GPU factory test
        run: zig build --sysroot "$MACOS_SYSROOT" gfxgpu-factory-test -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-platform-outputs
          path: zig-out
          if-no-files-found: ignore

  linux-arm-platform:
    # Raspberry Pi class target. GitHub's arm64 Linux runner executes the suites
    # natively, so this job proves the aarch64 build works rather than only that
    # it compiles.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            # The map-file tier's road builder test (TestM2VsoBuilder) loads a
            # road's descriptor through the storage, as the editor does.
            /Data/Terrain/sets/*/Roads3D/*.xml
            /Data/Terrain/sets/*/Rivers/*.xml
            /Data/Scenarios/Patches/Africa/p_settle_E_1.bzm
            /Data/Scenarios/Patches/common/road_junc/winter/p_junc_gr_asph_W_1.bzm
            /Data/Scenarios/Patches/spring_Ukraine/p_army_N_2.bzm
            /Data/Scenarios/Patches/spring_Ukraine/p_troops_gr_sw_1_2.bzm
            /Data/Scenarios/Patches/summer_Russia/p_ambush_gr_NS_1.bzm
            /Data/Scenarios/Patches/summer_Ukraine/p_lg_village_a_10.bzm
            /Data/Scenarios/Patches/winter_Russia/p_bridge_rail_n_4.bzm
          sparse-checkout-cone-mode: false

      - name: Verify arm64 host
        run: |
          test "$(uname -m)" = "aarch64"
          uname -a

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          zig_archive="zig-aarch64-linux-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.16.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-aarch64-linux-0.16.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Restore Zig build cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-aarch64-linux-gnu-zig-build-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-linux-gnu-zig-build-0.16.0-

      - name: Restore Unix Zig global cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-aarch64-linux-gnu-zig-global-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-linux-gnu-zig-global-0.16.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Run StreamIO filesystem tests
        run: zig build test-platform-files -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Run runtime module contract tests
        run: zig build test-platform-modules -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Run platform foundation matrix
        run: zig build test-platform-foundation -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Verify native runtime layout
        run: zig build verify-runtime -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Run native staging tests
        run: zig build test-stage -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Run diagnostics facade tests
        run: zig build test-platform-debug -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Run GFX GPU effect table tests
        run: zig build test-gfxgpu-core -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Map file tier
        run: zig build test-map-files -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Editor core tier
        run: zig build test-editor-core -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Editor kit tier
        run: zig build test-editor-kit -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Resource editor core tier
        run: zig build test-resource-core -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      # S03 slice gate on the fifth engine target: the MFC fidelity sweep and the
      # D-11 comparator over shipped Data read through the engine's own readers.
      - name: Resource model tier
        run: zig build test-resource-model -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview). No GPU device here, so it
      # prints "skipped: no GPU device" and exits 0; it still has to build.
      - name: Resource bridge tier
        run: zig build test-resource-bridge -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        run: zig build test-resource-mod-roundtrip -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Build the Map Editor overlay spike
        run: zig build editor-overlay-spike-build -Dtarget=aarch64-linux-gnu

      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=aarch64-linux-gnu

      - name: Run GFX GPU factory test
        run: zig build gfxgpu-factory-test -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm-platform-outputs
          path: zig-out
          if-no-files-found: ignore

  windows-mingw-platform:
    # The GNU Windows ABI. Zig ships its own mingw-w64 headers and import
    # libraries, so unlike the MSVC job this one needs no Visual Studio lookup.
    # It runs on Windows so the suites execute rather than only link.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
          sparse-checkout-cone-mode: false

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zigVersion = "0.16.0"
          $zigArchive = "zig-x86_64-windows-$zigVersion.zip"
          $zigArchivePath = Join-Path $env:RUNNER_TEMP $zigArchive
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/$zigArchive" -OutFile $zigArchivePath
          Expand-Archive -LiteralPath $zigArchivePath -DestinationPath $env:RUNNER_TEMP -Force
          $zigHome = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$zigVersion"
          Add-Content -Path $env:GITHUB_PATH -Value $zigHome
          & (Join-Path $zigHome "zig.exe") version

      - name: Restore Zig build cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-windows-gnu-zig-build-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-windows-gnu-zig-build-0.16.0-

      - name: Restore Windows Zig global cache
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\zig
          key: ${{ runner.os }}-x86_64-windows-gnu-zig-global-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-windows-gnu-zig-global-0.16.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Run StreamIO filesystem tests
        run: zig build test-platform-files -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Run runtime module contract tests
        run: zig build test-platform-modules -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Run platform foundation matrix
        run: zig build test-platform-foundation -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Verify native runtime layout
        run: zig build verify-runtime -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Run native staging tests
        run: zig build test-stage -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Run diagnostics facade tests
        run: zig build test-platform-debug -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Run GFX GPU effect table tests
        run: zig build test-gfxgpu-core -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Editor core tier
        run: zig build test-editor-core -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Editor kit tier
        run: zig build test-editor-kit -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Resource editor core tier
        run: zig build test-resource-core -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Build the Map Editor overlay spike
        run: zig build editor-overlay-spike-build -Dtarget=x86_64-windows-gnu

      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-windows-gnu

      # No factory test on mingw: it links Formats, which cannot build with that
      # toolchain at all - Platform/LegacyVariant.h reaches for MSVC's
      # comutil.h on any _WIN32 target and mingw does not ship it. Pre-existing
      # and unrelated to this test.

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-mingw-platform-outputs
          path: zig-out
          if-no-files-found: ignore

