name: Cross-platform validation

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            # The map-file tier's road builder test (TestM2VsoBuilder) loads a
            # road's descriptor through the storage, as the editor does.
            /Data/Terrain/sets/*/Roads3D/*.xml
            /Data/Terrain/sets/*/Rivers/*.xml
            # The mission data tier compares Data/Scenarios (144 MB) against
            # GOG 1.2's manifest, and the random missions tier's generator
            # reads templates, settings, chapters, contexts, patches,
            # scripts, fieldsets and graphs out of it.
            /Data/Scenarios/
          sparse-checkout-cone-mode: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.16.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.16.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Restore Zig build cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.16.0-

      - name: Restore Unix Zig global cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.16.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Run StreamIO filesystem tests
        run: zig build test-platform-files -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run runtime module contract tests
        run: zig build test-platform-modules -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run platform foundation matrix
        run: zig build test-platform-foundation -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Verify native runtime layout
        run: zig build verify-runtime -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run native staging tests
        run: zig build test-stage -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run diagnostics facade tests
        run: zig build test-platform-debug -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run GFX GPU effect table tests
        run: zig build test-gfxgpu-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Map file tier
        run: zig build test-map-files -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Mission data tier
        run: zig build test-mission-data -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Editor core tier
        run: zig build test-editor-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Editor kit tier
        run: zig build test-editor-kit -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor core tier
        run: zig build test-resource-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        run: zig build test-resource-model -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview). No GPU device here, so it
      # prints "skipped: no GPU device" and exits 0; it still has to build.
      - name: Resource bridge tier
        run: zig build test-resource-bridge -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        run: zig build test-resource-mod-roundtrip -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Build the Map Editor overlay spike
        run: zig build editor-overlay-spike-build -Dtarget=x86_64-linux-gnu

      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-linux-gnu

      - name: Run GFX GPU factory test
        id: gfxgpu-factory-test
        run: zig build gfxgpu-factory-test -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Backtrace the GFX GPU factory test
        if: failure() && steps.gfxgpu-factory-test.outcome == 'failure'
        run: |
          sudo apt-get install -y --no-install-recommends gdb binutils
          echo "=== ld.so init/fini calls, with the shared-object finalizer tracing its handle"
          BK_SO_FINALIZE_TRACE=1 LD_DEBUG=files zig-out/bin/gfxgpu-factory-test zig-out/lib/libGFXGPU.so 2>&1 | grep -iE "calling (init|fini)|finalize" | tail -20 || true
          echo "=== libGFXGPU.so: fini tags, finalizer and dso_handle symbols, handle passed to __cxa_atexit"
          readelf -dW zig-out/lib/libGFXGPU.so | grep -iE "fini|init" || true
          nm -C zig-out/lib/libGFXGPU.so | grep -iE "FinalizeSharedObject|__dso_handle|__cxa_(atexit|finalize)" || true
          readelf -xW .fini_array zig-out/lib/libGFXGPU.so || true
          objdump -dr -C zig-out/lib/libGFXGPU.so | grep -B6 -E "call.*__cxa_atexit" | grep -E "__dso_handle|__cxa_atexit|lea|mov" | head -30 || true
          objdump -d -C zig-out/lib/libGFXGPU.so --disassemble='FinalizeSharedObject()' | head -40 || true
          echo "=== gdb"
          gdb -batch -ex run -ex 'thread apply all bt' -ex 'info sharedlibrary' --args zig-out/bin/gfxgpu-factory-test zig-out/lib/libGFXGPU.so 2>&1 | tee gdb.log || true
          echo "=== fault address resolved against the objects the harness listed before dlclose"
          fault=$(grep -m1 -oE '^#0 +0x[0-9a-f]+' gdb.log | grep -oE '0x[0-9a-f]+' || true)
          grep 'gfxgpu-factory-test: object ' gdb.log | while read -r _ _ base path; do
            [ -n "$fault" ] || break
            off=$(( fault - base ))
            if [ "$off" -ge 0 ] && [ "$off" -lt 33554432 ]; then
              printf 'fault %s = %s + 0x%x\n' "$fault" "$path" "$off"
              [ -f "$path" ] && addr2line -f -C -e "$path" "$(printf 0x%x "$off")" || true
              [ -f "$path" ] && nm -nC --defined-only "$path" | awk -v o="$off" 'BEGIN{o=o+0} {a=strtonum("0x"$1); if (a<=o) last=$0} END{print "nearest symbol at or below: " last}' || true
            fi
          done

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-platform-outputs
          path: zig-out
          if-no-files-found: ignore

  windows-platform:
    runs-on: windows-latest
    # The cold build of the engine tier takes about 20 minutes here (run
    # 35683754678). The two runs that were cut off at 120 and 240 minutes were
    # not building: the test sat behind a debug-CRT abort() message box, which
    # editor_bridge_test.cpp now sends to stderr instead.
    # Raised to 75: run 36271881570 had every step green and was cancelled at
    # 60 minutes during post-job cleanup, after the random missions tiers
    # (37 minutes together) and a 5.5 minute upload of zig-out.
    # Raised to 110: a cold cache costs about 25 minutes in the engine tier
    # and 25 in the release random missions tier (runs 36335057255 and
    # 36397680132 were cut off at 75), and a job that is cut off never saved
    # its cache, so every later run started cold again. The caches are now
    # saved right after the random missions tier instead of at job end.
    timeout-minutes: 110

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/movies/progress/
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $zigVersion = "0.16.0"
          $zigArchive = "zig-x86_64-windows-$zigVersion.zip"
          $zigArchivePath = Join-Path $env:RUNNER_TEMP $zigArchive
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/$zigArchive" -OutFile $zigArchivePath
          Expand-Archive -LiteralPath $zigArchivePath -DestinationPath $env:RUNNER_TEMP -Force
          $zigHome = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$zigVersion"
          Add-Content -Path $env:GITHUB_PATH -Value $zigHome
          & (Join-Path $zigHome "zig.exe") version

      - name: Restore Zig build cache
        id: zig-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-windows-msvc-zig-build-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-windows-msvc-zig-build-0.16.0-

      - name: Restore Windows Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v5
        with:
          path: ~\AppData\Local\zig
          key: ${{ runner.os }}-x86_64-windows-msvc-zig-global-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-windows-msvc-zig-global-0.16.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Resolve MSVC and Windows SDK paths
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsInstall) { throw "Visual Studio C++ toolchain was not found" }

          $msvcRoot = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $sdkRoot = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvcRoot -or -not $sdkRoot) { throw "MSVC or Windows SDK directories were not found" }

          "MSVC_INCLUDE=$($msvcRoot.FullName)\include" >> $env:GITHUB_ENV
          "MSVC_LIB=$($msvcRoot.FullName)\lib" >> $env:GITHUB_ENV
          "WINDOWS_SDK_INCLUDE=$($sdkRoot.FullName)" >> $env:GITHUB_ENV
          "WINDOWS_SDK_LIB=$(${env:ProgramFiles(x86)})\Windows Kits\10\Lib\$($sdkRoot.Name)" >> $env:GITHUB_ENV

          Write-Host "Using MSVC: $($msvcRoot.FullName)"
          Write-Host "Using Windows SDK: $($sdkRoot.FullName)"

      - name: Run StreamIO filesystem tests
        run: zig build test-platform-files -Dtarget=x86_64-windows-msvc -Dtest-mode=compile "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run runtime module contract tests
        run: zig build test-platform-modules -Dtarget=x86_64-windows-msvc -Dtest-mode=compile "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run platform foundation matrix
        run: zig build test-platform-foundation -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Verify native runtime layout
        run: zig build verify-runtime -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run native staging tests
        run: zig build test-stage -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run diagnostics facade tests
        run: zig build test-platform-debug -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run GFX GPU effect table tests
        run: zig build test-gfxgpu-core -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Map file tier
        run: zig build test-map-files -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Editor core tier
        run: zig build test-editor-core -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Editor kit tier
        run: zig build test-editor-kit -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Resource editor core tier
        run: zig build test-resource-core -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # The app's own unit tests: view.zig's SDL event wiring against fake
      # bridges (WINDOWS.md 2), the panels' logic, Test in game's launch and
      # exit handling, BK_EDITOR_AUTO's parser. No engine or GPU.
      - name: Map editor unit tier
        run: zig build test-map-editor-view test-map-editor-panels test-map-editor-testlaunch test-map-editor-auto -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # Only here and on macos-14: the probe says those are the two runners with
      # a GPU device. The tier skips honestly where there is none, but a runner
      # that only ever skips is a 2.3 GB checkout for a line of output.
      - name: Engine tier
        env:
          # This job has a video driver and a GPU device (the probe step below), so a tool that
          # would print "skipped" and exit 0 fails instead, here and in the engine-hosted steps after it.
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-editor-bridge -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # S04 slice gate: the resource bridge through the engine, including the
      # preview captures (mesh, sprite, effect) measured by code.
      - name: Resource bridge tier
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-resource-bridge -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-resource-mod-roundtrip -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # The scripted editor scenarios (Map editor scenarios below) place their
      # clicks for the editor's own 1280x800 window, the size it gets on the
      # macOS runners. This runner's desktop is 1024x768, which shrinks the
      # window to 1008x681; there the right-hand panels start at x=688 and
      # points like M2's dblclick=c200x-250 land on them (CI 37155733296: a
      # click into the Properties panel's x field left the road tool with no
      # point in hand). A 1920x1080 desktop gives the window its full size.
      - name: Desktop large enough for the editor's window
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class BkDisplay {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;
                  public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
                  public int dmDisplayFlags; public int dmDisplayFrequency;
                  public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;
                  public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
              // The primary display's mode now (ENUM_CURRENT_SETTINGS, device null:
              // done here, as PowerShell would pass a null string as "").
              public static DEVMODE Current() {
                  DEVMODE dm = new DEVMODE();
                  dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (!EnumDisplaySettings(null, -1, ref dm)) throw new Exception("EnumDisplaySettings failed: " + Marshal.GetLastWin32Error());
                  return dm;
              }
              public static int Change(int width, int height) {
                  DEVMODE dm = Current();
                  dm.dmPelsWidth = width;
                  dm.dmPelsHeight = height;
                  dm.dmFields = 0x00080000 | 0x00100000; // DM_PELSWIDTH | DM_PELSHEIGHT
                  return ChangeDisplaySettings(ref dm, 0);
              }
          }
          "@
          $before = [BkDisplay]::Current()
          Write-Host "desktop before: $($before.dmPelsWidth)x$($before.dmPelsHeight)"
          $result = [BkDisplay]::Change(1920, 1080)
          if ($result -ne 0) { throw "ChangeDisplaySettings to 1920x1080 returned $result" }
          $now = [BkDisplay]::Current()
          Write-Host "desktop now: $($now.dmPelsWidth)x$($now.dmPelsHeight)"
          if ($now.dmPelsWidth -lt 1280 -or $now.dmPelsHeight -lt 900) { throw "the desktop is still $($now.dmPelsWidth)x$($now.dmPelsHeight)" }

      # MapEditor itself: the engine started hidden with ImGui over it, one
      # frame captured as presented and checked for both.
      - name: Map editor host
        run: zig build map-editor-host-check -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # MapEditor's interactive loop, hidden, driven by scripted SDL events:
      # paint, place, select, drag, turn, delete, undo it all, save, reopen.
      - name: Map editor smoke
        run: zig build map-editor-smoke -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # S05 slice gate: ResourceEditor installs beside Game and MapEditor.
      - name: Resource editor install
        run: zig build install-resource-editor -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      # ResourceEditor itself: the engine hidden with ImGui over it, a frame
      # and a thumbnail measured by code; then its scripted new/save/reopen and
      # edit/undo/save byte-compare; then BK_EDITOR_AUTO's scenario over the
      # resource command registry (new, open, edit, undo, save, pack, import,
      # Run Blitzkrieg). A host with no GPU device logs the skip and passes.
      - name: Resource editor host
