      - name: Game reads its languages (de)
        if: matrix.part == 'l10n-2'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" l10n-game-reads-it-de -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Game reads its languages (pt-br)
        if: matrix.part == 'l10n-2'
