          Write-Host "Using Windows SDK: $($sdkRoot.FullName)"

      - name: Compile the tiers
        shell: pwsh
        run: zig build bk-font-game-reads-it editor-overlay-spike-build elk-game-reads-it elk-l10n-auto elk-smoke gfxgpu-factory-test install-game install-language-mods install-map-editor install-resource-editor map-editor-host-check map-editor-l10n-auto resource-editor-l10n-auto test-bk-font test-bk-image test-bk-l10n test-bk-map test-bk-memory test-bk-memory-c-sources test-bk-memory-import-audit test-bk-memory-zig test-bk-memory-zig-host test-bk-pak test-bk-sprite test-bk-table test-bk-tools test-bk-tools-l10n test-bk-video test-editor-bridge test-editor-core test-editor-kit test-elk-app test-elk-core test-gfxgpu-core test-l10n-measure test-map-editor-auto test-map-editor-engine test-map-editor-panels test-map-editor-testlaunch test-map-editor-view test-map-files test-platform-debug test-platform-files test-platform-foundation test-platform-modules test-platform-system test-random-missions test-rmg-composer-roundtrip test-rmg-determinism test-season-textures test-stage verify-runtime -Dtest-mode=compile -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" --summary new

      - name: Compile the tiers with --release=fast
        shell: pwsh
        run: zig build install-game test-random-missions -Dtest-mode=compile -Dtarget=x86_64-windows-msvc --release=fast "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" --summary new

      - name: Compile the tiers with -Dbk-mem-stack-frames=0
        shell: pwsh
        run: zig build resource-editor-auto-3rd resource-editor-auto-3rv resource-editor-auto-bdg resource-editor-auto-bld resource-editor-auto-cgc resource-editor-auto-chc resource-editor-auto-core resource-editor-auto-eff resource-editor-auto-fnc resource-editor-auto-gui resource-editor-auto-mdc resource-editor-auto-mip resource-editor-auto-msh resource-editor-auto-obt resource-editor-auto-pcp resource-editor-auto-spt resource-editor-auto-til resource-editor-auto-unt resource-editor-auto-wpn resource-editor-batch resource-editor-game-reads-it resource-editor-host-check resource-editor-smoke test-resource-bridge test-resource-core test-resource-mod-roundtrip test-resource-model -Dtest-mode=compile -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0 --summary new



      # Saved from main only (2026-10-08): every branch saving its own set took
      # the repository's caches to 13.4 GB, over GitHub's 10 GB, and evicted them.
      # Any branch can restore main's caches.
      # Saved here, not at job end: by now the debug engine and the release
      # game are built, and a job cut off later still leaves the next run warm.
      - name: Save Zig build cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}



      - name: Save Windows Zig global cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~\AppData\Local\zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}

      # The fan-out (CI-FANOUT-DESIGN.md): the tier jobs download this build and
      # run their tiers from it without compiling. The repository's .zig-cache and
      # zig-pkg go in one archive, the global cache in another.
      - name: Pack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$(cygpath -u "$LOCALAPPDATA")"
          zstd --version
          du -sh .zig-cache zig-pkg "$gparent/zig" || true
          mkdir -p "$RUNNER_TEMP/bk-build"
          tar -cf - .zig-cache zig-pkg | zstd -T0 -1 -q -o "$RUNNER_TEMP/bk-build/build.tar.zst"
          tar -C "$gparent" -cf - zig | zstd -T0 -1 -q -o "$RUNNER_TEMP/bk-build/global.tar.zst"
          ls -l "$RUNNER_TEMP/bk-build"
          echo "pack took $(( $(date +%s) - start )) s"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: ${{ runner.temp }}/bk-build
          compression-level: 0
          retention-days: 1

