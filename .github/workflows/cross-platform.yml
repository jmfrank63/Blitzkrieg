  macos-map-editor:
    needs: [changes, macos-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))
    name: "macOS arm64 - Map Editor (${{ matrix.label }})"
    runs-on: macos-14
    # Split from macos-game (2026-10-08) so each product shows its own result. It restores
    # the caches macos-game saves and does not save its own. The debug
    # SafeAllocator's seconds-per-frame previews measured 91 minutes here on
    # run 38119220988, past the old 90.
    timeout-minutes: 60

    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "all", label: "all tiers", shard: "", sweep: "all" }
          - { part: "l10n", label: "ten languages", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            # The resource tiers read the Medals and Old (.unt) folders too.
            /Data/Medals/
            /Data/Old/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      # The macOS build is 7 GB packed and about 21 GB unpacked (run 39460191996:
      # "No space left on device" in a tier job's unpack). The build job frees the
      # image's spare Xcode versions and the Android SDK; each tier job does too.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          keep=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$keep" ] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf "$HOME/Library/Android"
          df -h /


      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_host_arch="$(uname -m)"
          case "$zig_host_arch" in
            arm64) zig_host_arch="aarch64" ;;
            x86_64) zig_host_arch="x86_64" ;;
            *) echo "Unsupported macOS host architecture: $zig_host_arch" >&2; exit 1 ;;
          esac
          zig_archive="zig-${zig_host_arch}-macos-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-${zig_host_arch}-macos-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Configure macOS SDK sysroot
        run: echo "MACOS_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"


      # The shared editor core and ImGui kit, used by both editors; run once, here.
      - name: Editor core tier
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-editor-core -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Editor kit tier
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-editor-kit -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Map file tier
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-map-files -Dtarget=aarch64-macos -Dtest-mode=run


      # The app's own unit tests (see the Windows job's step of this name).
      - name: Map editor unit tier
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-map-editor-view test-map-editor-panels test-map-editor-testlaunch test-map-editor-auto -Dtarget=aarch64-macos -Dtest-mode=run


      # MapEditor itself: the engine started hidden with ImGui over it, one
      # frame captured as presented and checked for both.
      - name: Map editor host
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" map-editor-host-check -Dtarget=aarch64-macos -Dtest-mode=run


      # MapEditor's interactive loop, hidden, driven by scripted SDL events:
      # paint, place, select, drag, turn, delete, undo it all, save, reopen.
      - name: Map editor smoke
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" map-editor-smoke -Dtarget=aarch64-macos -Dtest-mode=run


      # The editor core driving the real engine through the Zig adapter.
      - name: Map editor engine tier
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-map-editor-engine -Dtarget=aarch64-macos -Dtest-mode=run


      # The scripted editor scenarios (05-REVIEW WR-D05): BK_EDITOR_AUTO's M1, M2
      # and M3 scripts, one after the other (each step depends on the one before,
      # so two engines never start at once), with their do=/expect= predicates.
      - name: Map editor scenarios
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" map-editor-m3-auto -Dtarget=aarch64-macos -Dtest-mode=run


      # The real Game playing what the editor saved: M1's placed unit, M2's
      # BK_MAP_TRACE report, and M3's railroad with fewer than two control
      # points (D-33, the CRailroadGraphConstructor crash) - its regression gate.
      - name: Game reads the editor's maps
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" map-editor-game-reads-it-m3 -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Build the Map Editor overlay spike
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" editor-overlay-spike-build -Dtarget=aarch64-macos


      # Moved from the Game job (2026-10-08) and run on the debug build, which this job
      # makes anyway: in release they reused the Game job's release build (under a minute
      # each), and the debug build checks the engine's asserts too.
      - name: RMG composer round trip
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-rmg-composer-roundtrip -Dtarget=aarch64-macos -Dtest-mode=run


      - name: RMG determinism
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-rmg-determinism -Dtarget=aarch64-macos -Dtest-mode=run


      # D088: the measured tiers compare against hb-view's rasters; Homebrew's harfbuzz ships it.
      - name: Install hb-view
        if: matrix.part == 'l10n'
        run: |
          brew install harfbuzz
          command -v hb-view

      - name: Map Editor in ten languages
        if: matrix.part == 'l10n'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" map-editor-l10n-auto -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Upload generated outputs
        # Only when the part failed: on Windows the upload alone took 5.5 minutes.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-map-editor-outputs-${{ matrix.part }}
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

