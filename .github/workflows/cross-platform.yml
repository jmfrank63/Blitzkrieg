      # The logs and captures, not the staged and copied Data trees or the packages:
      # those made each upload 1-2 GB, 7 minutes here (run 37712856614). Same in every job.
      - name: bk-* string tables
        if: matrix.part == 'all'
        shell: pwsh
        run: zig build test-bk-l10n -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: bk-* tools in ten languages
        if: matrix.part == 'all'
