      - name: Run runtime module contract tests
        if: matrix.part == 'platform'
        run: zig build test-platform-modules -Dtarget=x86_64-windows-msvc -Dtest-mode=compile "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Run platform foundation matrix
        if: matrix.part == 'platform'
        run: zig build test-platform-foundation -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Verify native runtime layout
        if: matrix.part == 'platform'
        run: zig build verify-runtime -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Run native staging tests
        if: matrix.part == 'platform'
        run: zig build test-stage -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Run diagnostics facade tests
        if: matrix.part == 'platform'
        run: zig build test-platform-debug -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

      - name: Run system facade tests
        if: matrix.part == 'platform'
        run: zig build test-platform-system test-unicode-paths test-mods-paths -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Run GFX GPU effect table tests
        if: matrix.part == 'platform'
        run: zig build test-gfxgpu-core -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      # Only here and on macos-14: the probe says those are the two runners with
      # a GPU device. The tier skips honestly where there is none, but a runner
      # that only ever skips is a 2.3 GB checkout for a line of output.
      - name: Engine tier
        if: contains(fromJSON('["engine-1", "engine-2", "engine-3", "engine-4", "engine-5"]'), matrix.part)
        env:
          # This job has a video driver and a GPU device (the probe step below), so a tool that
          # would print "skipped" and exit 0 fails instead, here and in the engine-hosted steps after it.
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-editor-bridge -Dtarget=x86_64-windows-msvc -Dtest-mode=run ${{ matrix.shard }} "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Random missions tier
        if: contains(fromJSON('["random-1", "random-2", "random-3"]'), matrix.part)
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-windows-msvc --release=fast -Dtest-mode=run -Drandom-missions-sweep=${{ matrix.sweep }} "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      # The leak gate: one template generated and opened 20 times over, the same maps every round;
      # the test fails if the heap grows over the last 10 rounds (tools/zig/random_missions_test.cpp).
      - name: Random missions leak gate
        if: matrix.part == 'gate'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-windows-msvc --release=fast -Dtest-mode=run "-Drandom-missions-sweep=only=summer_ukraine\securearea00" -Drandom-missions-repeat=20 "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        if: matrix.part == 'platform'
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      - name: Run GFX GPU factory test
        if: matrix.part == 'platform'
        run: zig build gfxgpu-factory-test -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"



      # The Windows package, built for real: until 03-16 no job ran any package
      # step (03-VERIFICATION.md). Last, after the mid-job cache saves, so a
      # slow package run never costs the next run its warm cache. Release only
      # (2026-10-08): it is the variant that ships, the release engine is already
      # built by the random missions tier, and a debug package would compile the
      # debug MapEditor and ResourceEditor here a second time (the editor jobs
      # build them). The free space is printed first: it stages a second copy of
      # the checked-out Data and writes two stored zips.
      - name: Package the release game with the editors
        if: matrix.part == 'gate'
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free / 1GB, 1)}}, @{n='UsedGB';e={[math]::Round($_.Used / 1GB, 1)}}
          zig build package-game-editors -Dtarget=x86_64-windows-msvc --release=fast "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }



      # D-08: MapEditor.exe sits beside Game.exe at the package root, with the
      # generated SeasonData and the legacy Editors, and no repository mods/.
      # The zip format counts entries in 16 bits and package.zig refuses more
      # than 65,535 (Data alone is 63,809 files), so the count is printed and
      # checked too. The release zips have to carry the Game.exe the release
      # build just installed, not one an earlier build left in zig-out/bin.
      # The package outputs are deleted afterwards: zig-out is uploaded below,
      # and they are two more copies of Data.
      - name: Check the Windows packages
        if: matrix.part == 'gate'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $releaseGame = (Get-Item "zig-out/bin/Game.exe").Length
          try {
            foreach ($variant in @("release")) {
              $packages = "zig-out/packages/windows/x86_64/$variant"
              foreach ($zipName in @("Blitzkrieg-game.zip", "Blitzkrieg-game-with-editors.zip")) {
                $zipPath = Join-Path $packages $zipName
                if (-not (Test-Path $zipPath)) { throw "$zipName was not written to $packages" }
                $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
                try {
                  $names = @($zip.Entries | ForEach-Object { $_.FullName })
                  $sizeGB = [math]::Round((Get-Item $zipPath).Length / 1GB, 2)
                  Write-Host "${variant}/${zipName}: $($names.Count) entries, $sizeGB GB"
                  if ($names.Count -gt 65535) { throw "${variant}/${zipName} has $($names.Count) entries, more than a zip without Zip64 can count" }
                  foreach ($required in @("Game.exe", "MapEditor.exe")) {
                    if ($names -notcontains $required) { throw "${variant}/${zipName} has no $required at its root" }
                  }
                  $game = ($zip.Entries | Where-Object { $_.FullName -eq "Game.exe" }).Length
                  Write-Host "  Game.exe: $game bytes (zig-out/bin/Game.exe of the release build: $releaseGame)"
                  if ($variant -eq "release" -and $game -ne $releaseGame) { throw "${variant}/${zipName} carries a Game.exe the release build did not install" }
                  $seasonData = @($names | Where-Object { $_ -like "SeasonData/*" })
                  if ($seasonData.Count -eq 0) { throw "${variant}/${zipName} has no SeasonData/" }
                  Write-Host "  SeasonData: $($seasonData -join ', ')"
                  if (@($names | Where-Object { $_ -like "mods/*" }).Count -ne 0) { throw "${variant}/${zipName} has a top-level mods/" }
                  $editors = @($names | Where-Object { $_ -like "Editors/*" })
                  if ($zipName -eq "Blitzkrieg-game-with-editors.zip") {
                    if ($editors.Count -eq 0) { throw "${variant}/${zipName} has no Editors/" }
                    Write-Host "  Editors: $($editors -join ', ')"
                  } elseif ($editors.Count -ne 0) {
                    throw "${variant}/${zipName} has Editors/ entries: $($editors -join ', ')"
                  }
                } finally {
                  $zip.Dispose()
                }
              }
            }
          } finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "zig-out/packages", "zig-out/game/windows/x86_64/release/package"
          }



      # The logs and captures, not the staged and copied Data trees or the packages:
      # those made each upload 1-2 GB, 7 minutes here (run 37712856614). Same in every job.
      # M002 S09, D088: Windows builds the nine language mods and runs the contract checks; the
      # measured l10n tiers (hb-view rasters) run on Linux and macOS and are only compiled here.
      - name: Build the language mods
        if: matrix.part == 'l10n'
        shell: pwsh
        run: zig build language-mods -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: Upload generated outputs
        # Only when the part failed: on Windows the upload alone took 5.5 minutes.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-game-outputs-${{ matrix.part }}
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore


      - name: BkMemory Zig tests
        if: matrix.part == 'platform'
        shell: pwsh
        run: zig build test-bk-memory-zig -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: BkMemory cross-module test
        if: matrix.part == 'platform'
        shell: pwsh
        run: zig build test-bk-memory -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: BkMemory Zig host
        if: matrix.part == 'platform'
        shell: pwsh
        run: zig build test-bk-memory-zig-host -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: BkMemory in the C libraries
        if: matrix.part == 'platform'
        shell: pwsh
        run: zig build test-bk-memory-c-sources -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: BkMemory import audit tests
        if: matrix.part == 'platform'
        shell: pwsh
        run: zig build test-bk-memory-import-audit -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"

  windows-resource-editor:
    needs: [changes, windows-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))
    name: "Windows x64 MSVC - Resource Editor (${{ matrix.label }})"
    runs-on: windows-latest
    # The Resource Editor's engine-hosted steps, split from windows-game
    # (run 37691999377: 25 minutes of them on top of the shared engine build,
    # about 23 cold). This job restores the caches windows-game saves and
    # does not save its own. Under the debug SafeAllocator the drawn preview
    # frames take seconds each on the hosted runners (the M003 timer trace
    # measured 1.3-14 s per frame), which pushed this job past 90 minutes
    # (run 38127992252: cancelled at 91); S04's allocator decision owns the
    # slowdown, the budget here is sized for it.
    timeout-minutes: 60


    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "core", label: "core, model and mod tiers", shard: "", sweep: "all" }
          - { part: "bridge-1", label: "bridge tier 1/11", shard: "-Dresource-bridge-shard=1", sweep: "all" }
          - { part: "bridge-2", label: "bridge tier 2/11", shard: "-Dresource-bridge-shard=2", sweep: "all" }
          - { part: "bridge-3", label: "bridge tier 3/11", shard: "-Dresource-bridge-shard=3", sweep: "all" }
          - { part: "bridge-4", label: "bridge tier 4/11", shard: "-Dresource-bridge-shard=4", sweep: "all" }
          - { part: "bridge-5", label: "bridge tier 5/11", shard: "-Dresource-bridge-shard=5", sweep: "all" }
          - { part: "bridge-6", label: "bridge tier 6/11", shard: "-Dresource-bridge-shard=6", sweep: "all" }
          - { part: "bridge-7", label: "bridge tier 7/11", shard: "-Dresource-bridge-shard=7", sweep: "all" }
          - { part: "bridge-8", label: "bridge tier 8/11", shard: "-Dresource-bridge-shard=8", sweep: "all" }
          - { part: "bridge-9", label: "bridge tier 9/11", shard: "-Dresource-bridge-shard=9", sweep: "all" }
          - { part: "bridge-10", label: "bridge tier 10/11", shard: "-Dresource-bridge-shard=10", sweep: "all" }
          - { part: "bridge-11", label: "bridge tier 11/11", shard: "-Dresource-bridge-shard=11", sweep: "all" }
          - { part: "editor-1", label: "editor and autos 1", shard: "", sweep: "all" }
          - { part: "editor-2", label: "autos 2", shard: "", sweep: "all" }
          - { part: "editor-3", label: "autos 3 and the game", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            # The resource tiers read the Medals and Old (.unt) folders too.
            /Data/Medals/
            /Data/Old/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Install Zig 0.17.0
        shell: pwsh
        run: |
          $zigVersion = "0.17.0"
          $zigArchive = "zig-x86_64-windows-$zigVersion.zip"
          $zigArchivePath = Join-Path $env:RUNNER_TEMP $zigArchive
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/$zigArchive" -OutFile $zigArchivePath
          Expand-Archive -LiteralPath $zigArchivePath -DestinationPath $env:RUNNER_TEMP -Force
          $zigHome = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$zigVersion"
          Add-Content -Path $env:GITHUB_PATH -Value $zigHome
          & (Join-Path $zigHome "zig.exe") version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$(cygpath -u "$LOCALAPPDATA")"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Resolve MSVC and Windows SDK paths
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsInstall) { throw "Visual Studio C++ toolchain was not found" }

          $msvcRoot = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $sdkRoot = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvcRoot -or -not $sdkRoot) { throw "MSVC or Windows SDK directories were not found" }

          "MSVC_INCLUDE=$($msvcRoot.FullName)\include" >> $env:GITHUB_ENV
          "MSVC_LIB=$($msvcRoot.FullName)\lib" >> $env:GITHUB_ENV
          "WINDOWS_SDK_INCLUDE=$($sdkRoot.FullName)" >> $env:GITHUB_ENV
          "WINDOWS_SDK_LIB=$(${env:ProgramFiles(x86)})\Windows Kits\10\Lib\$($sdkRoot.Name)" >> $env:GITHUB_ENV

          Write-Host "Using MSVC: $($msvcRoot.FullName)"
          Write-Host "Using Windows SDK: $($sdkRoot.FullName)"


      # D086 completed for Windows: the counted CI tiers never print stacks, so they
      # build without per-allocation captures (0 frames) - the 24-frame records made
      # this job overrun its 150-minute budget (it needs about 90 minutes capture-free).
      - name: Resource editor core tier
        if: matrix.part == 'core'
        run: zig build test-resource-core -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      # S04 slice gate: the resource bridge through the engine, including the
      # preview captures (mesh, sprite, effect) measured by code.
      - name: Resource bridge tier
        if: contains(fromJSON('["bridge-1", "bridge-2", "bridge-3", "bridge-4", "bridge-5", "bridge-6", "bridge-7", "bridge-8", "bridge-9", "bridge-10", "bridge-11"]'), matrix.part)
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-resource-bridge -Dtarget=x86_64-windows-msvc -Dtest-mode=run ${{ matrix.shard }} "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        if: matrix.part == 'core'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-resource-mod-roundtrip -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      # The scripted editor scenarios (Map editor scenarios below) place their
      # clicks for the editor's own 1280x800 window, the size it gets on the
      # macOS runners. This runner's desktop is 1024x768, which shrinks the
      # window to 1008x681; there the right-hand panels start at x=688 and
      # points like M2's dblclick=c200x-250 land on them (CI 37155733296: a
      # click into the Properties panel's x field left the road tool with no
      # point in hand). A 1920x1080 desktop gives the window its full size.
      - name: Desktop large enough for the editor's window
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class BkDisplay {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;
                  public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
                  public int dmDisplayFlags; public int dmDisplayFrequency;
                  public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;
                  public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
              // The primary display's mode now (ENUM_CURRENT_SETTINGS, device null:
              // done here, as PowerShell would pass a null string as "").
              public static DEVMODE Current() {
                  DEVMODE dm = new DEVMODE();
                  dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (!EnumDisplaySettings(null, -1, ref dm)) throw new Exception("EnumDisplaySettings failed: " + Marshal.GetLastWin32Error());
                  return dm;
              }
              public static int Change(int width, int height) {
                  DEVMODE dm = Current();
                  dm.dmPelsWidth = width;
                  dm.dmPelsHeight = height;
                  dm.dmFields = 0x00080000 | 0x00100000; // DM_PELSWIDTH | DM_PELSHEIGHT
                  return ChangeDisplaySettings(ref dm, 0);
              }
          }
          "@
          $before = [BkDisplay]::Current()
          Write-Host "desktop before: $($before.dmPelsWidth)x$($before.dmPelsHeight)"
          $result = [BkDisplay]::Change(1920, 1080)
          if ($result -ne 0) { throw "ChangeDisplaySettings to 1920x1080 returned $result" }
          $now = [BkDisplay]::Current()
          Write-Host "desktop now: $($now.dmPelsWidth)x$($now.dmPelsHeight)"
          if ($now.dmPelsWidth -lt 1280 -or $now.dmPelsHeight -lt 900) { throw "the desktop is still $($now.dmPelsWidth)x$($now.dmPelsHeight)" }


      # S05 slice gate: ResourceEditor installs beside Game and MapEditor.
      - name: Resource editor install
        if: contains(fromJSON('["editor-1", "editor-2", "editor-3"]'), matrix.part)
        run: zig build install-resource-editor -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # ResourceEditor itself: the engine hidden with ImGui over it, a frame
      # and a thumbnail measured by code; then its scripted new/save/reopen and
      # edit/undo/save byte-compare; then BK_EDITOR_AUTO's scenario over the
      # resource command registry (new, open, edit, undo, save, pack, import,
      # Run Blitzkrieg). A host with no GPU device logs the skip and passes.
      - name: Resource editor host
        if: matrix.part == 'editor-1'
        run: zig build resource-editor-host-check -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


