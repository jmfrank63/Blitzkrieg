        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-obt -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto fnc
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-fnc -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto bld
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-bld -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto bdg
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-bdg -Dtarget=aarch64-macos -Dtest-mode=run


