      - name: Compile GFX GPU factory test
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" gfxgpu-factory-test -Dtarget=x86_64-macos -Dtest-mode=compile


      # Saved from main only, as in windows-game, and before the slow tail of the job.
      - name: Save Zig build cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}


      - name: Save Unix Zig global cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}


      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel-platform-outputs
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

