          restore-keys: |
            ${{ runner.os }}-x86_64-windows-msvc-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-



      - name: Restore Windows Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v6
        with:
          path: ~\AppData\Local\zig
          key: ${{ runner.os }}-x86_64-windows-msvc-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
