  macos-resource-editor:
    needs: [changes, macos-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))
    name: "macOS arm64 - Resource Editor (${{ matrix.label }})"
    runs-on: macos-14
    # Split from macos-game (2026-10-08) so each product shows its own result. It restores
    # the caches macos-game saves and does not save its own. The debug
    # SafeAllocator's seconds-per-frame previews measured 91 minutes here on
    # run 38119220988, past the old 90 (cancelled).
    timeout-minutes: 60

    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "bridge", label: "core, model and bridge tiers", shard: "", sweep: "all" }
          - { part: "editor", label: "editor and autos", shard: "", sweep: "all" }
          - { part: "l10n", label: "ten languages", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            # The resource tiers read the Medals and Old (.unt) folders too.
            /Data/Medals/
            /Data/Old/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      # The macOS build is 7 GB packed and about 21 GB unpacked (run 39460191996:
      # "No space left on device" in a tier job's unpack). The build job frees the
      # image's spare Xcode versions and the Android SDK; each tier job does too.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          keep=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$keep" ] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf "$HOME/Library/Android"
          df -h /


      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_host_arch="$(uname -m)"
          case "$zig_host_arch" in
            arm64) zig_host_arch="aarch64" ;;
            x86_64) zig_host_arch="x86_64" ;;
            *) echo "Unsupported macOS host architecture: $zig_host_arch" >&2; exit 1 ;;
          esac
          zig_archive="zig-${zig_host_arch}-macos-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-${zig_host_arch}-macos-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Configure macOS SDK sysroot
        run: echo "MACOS_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"


      - name: Resource editor core tier
        if: matrix.part == 'bridge'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-resource-core -Dtarget=aarch64-macos -Dtest-mode=run


      # S04 slice gate: the resource bridge through the engine, including the
      # preview captures (mesh, sprite, effect) measured by code.
      - name: Resource bridge tier
        if: matrix.part == 'bridge'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-resource-bridge -Dtarget=aarch64-macos -Dtest-mode=run ${{ matrix.shard }}


      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        if: matrix.part == 'bridge'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-resource-mod-roundtrip -Dtarget=aarch64-macos -Dtest-mode=run


      # S05 slice gate: ResourceEditor installs beside Game and MapEditor.
      - name: Resource editor install
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" install-resource-editor -Dtarget=aarch64-macos


      # ResourceEditor itself: the engine hidden with ImGui over it, a frame
      # and a thumbnail measured by code; then its scripted new/save/reopen and
      # edit/undo/save byte-compare; then BK_EDITOR_AUTO's scenario over the
      # resource command registry (new, open, edit, undo, save, pack, import,
      # Run Blitzkrieg). A host with no GPU device logs the skip and passes.
      - name: Resource editor host
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-host-check -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor smoke
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-smoke -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor batch
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-batch -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto core
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-core -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto wpn
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-wpn -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto unt
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-unt -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto spt
        if: matrix.part == 'editor'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" resource-editor-auto-spt -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Resource editor auto msh
