        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-gfxgpu-core -Dtarget=aarch64-macos -Dtest-mode=run



      - name: Engine tier
        if: matrix.part == 'engine'
        env:
          # This job has a video driver and a GPU device (the probe step below), so a tool that
          # would print "skipped" and exit 0 fails instead, here and in the engine-hosted steps after it.
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-editor-bridge -Dtarget=aarch64-macos -Dtest-mode=run ${{ matrix.shard }}



      # The game's SDL event translation, through the real SDLApplication and
      # a real window: wheel deltas (a trackpad swipe's fractions, flipped,
      # finger-marked), keys, text and timestamps. Needs a video driver.
      - name: SDL event translation
        if: matrix.part == 'random'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-platform-events -Dtarget=aarch64-macos -Dtest-mode=run



      - name: Random missions tier
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-random-missions -Dtarget=aarch64-macos --release=fast -Dtest-mode=run -Drandom-missions-sweep=${{ matrix.sweep }}



      # The leak gate: one template generated and opened 20 times over, the same maps every round;
      # the test fails if the heap grows over the last 10 rounds (tools/zig/random_missions_test.cpp).
      - name: Random missions leak gate
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-random-missions -Dtarget=aarch64-macos --release=fast -Dtest-mode=run "-Drandom-missions-sweep=only=summer_ukraine\securearea00" -Drandom-missions-repeat=20



      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        if: matrix.part == 'random'
        continue-on-error: true
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" gpu-device-probe -Dtarget=aarch64-macos



      - name: Run GFX GPU factory test
        if: matrix.part == 'random'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" gfxgpu-factory-test -Dtarget=aarch64-macos -Dtest-mode=run



      # M002 S09: the real Game on English and the nine language mods, one step per language, split
      # over two parts as on Linux. The shards measure against hb-view's rasters (D088).
      # D088: the measured tiers compare against hb-view's rasters; Homebrew's harfbuzz ships it.
      - name: Install hb-view
        if: contains(fromJSON('["l10n-1", "l10n-2"]'), matrix.part)
        run: |
          brew install harfbuzz
          command -v hb-view

      - name: Install the language mods
        if: contains(fromJSON('["l10n-1", "l10n-2"]'), matrix.part)
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" install-game install-language-mods -Dtarget=aarch64-macos

      - name: Game reads its languages (en)
