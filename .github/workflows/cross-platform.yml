        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" l10n-game-reads-it-en -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Game reads its languages (ru)
        if: matrix.part == 'l10n-1'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" l10n-game-reads-it-ru -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Game reads its languages (zh-hans)
