        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" l10n-game-reads-it-ja -Dtarget=aarch64-macos -Dtest-mode=run

      - name: Game reads its languages (hi)
        if: matrix.part == 'l10n-1'
        env:
