  linux-map-editor:
    needs: [changes, linux-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'
    name: "Linux x64 - Map Editor (${{ matrix.label }})"
    runs-on: ubuntu-24.04
    # Split from linux-game (2026-10-08) so each product shows its own result. It restores
    # the caches linux-game saves and does not save its own. The engine renders on lavapipe.
    timeout-minutes: 60

    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "all", label: "all tiers", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
