        run: zig build resource-editor-auto-chc -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      - name: Resource editor auto cgc
        if: matrix.part == 'editor-3'
        run: zig build resource-editor-auto-cgc -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      - name: Resource editor auto mdc
        if: matrix.part == 'editor-3'
        run: zig build resource-editor-auto-mdc -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      - name: Resource editor auto gui
        if: matrix.part == 'editor-3'
        run: zig build resource-editor-auto-gui -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      - name: Game reads the Resource Editor's exports
        if: matrix.part == 'editor-3'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-game-reads-it -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        if: matrix.part == 'core'
        run: zig build test-resource-model -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB" -Dbk-mem-stack-frames=0


      - name: Upload generated outputs
        # Only when the part failed: on Windows the upload alone took 5.5 minutes.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-resource-editor-outputs-${{ matrix.part }}
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

  windows-map-editor:
    needs: [changes, windows-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))
    name: "Windows x64 MSVC - Map Editor (${{ matrix.label }})"
    runs-on: windows-latest
    # The Map Editor's steps, split from windows-game (run 37691999377: 18
    # minutes of them on top of the shared engine build, about 23 cold). This
    # job restores the caches windows-game saves and does not save its own.
    # The debug SafeAllocator's per-frame cost (M003) measured 76 minutes here,
    # inside the old 75-minute budget by one minute.
    timeout-minutes: 60


    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "core", label: "editor and map file tiers", shard: "", sweep: "all" }
          - { part: "host", label: "host, smoke and engine tiers", shard: "", sweep: "all" }
          - { part: "scenarios", label: "scenarios", shard: "", sweep: "all" }
          - { part: "reads", label: "the game reads the maps", shard: "", sweep: "all" }
          - { part: "random", label: "random missions and RMG", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            # The resource tiers read the Medals and Old (.unt) folders too.
            /Data/Medals/
            /Data/Old/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Install Zig 0.17.0
        shell: pwsh
        run: |
          $zigVersion = "0.17.0"
          $zigArchive = "zig-x86_64-windows-$zigVersion.zip"
          $zigArchivePath = Join-Path $env:RUNNER_TEMP $zigArchive
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/$zigArchive" -OutFile $zigArchivePath
          Expand-Archive -LiteralPath $zigArchivePath -DestinationPath $env:RUNNER_TEMP -Force
          $zigHome = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$zigVersion"
          Add-Content -Path $env:GITHUB_PATH -Value $zigHome
          & (Join-Path $zigHome "zig.exe") version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$(cygpath -u "$LOCALAPPDATA")"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Resolve MSVC and Windows SDK paths
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsInstall) { throw "Visual Studio C++ toolchain was not found" }

          $msvcRoot = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $sdkRoot = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvcRoot -or -not $sdkRoot) { throw "MSVC or Windows SDK directories were not found" }

          "MSVC_INCLUDE=$($msvcRoot.FullName)\include" >> $env:GITHUB_ENV
          "MSVC_LIB=$($msvcRoot.FullName)\lib" >> $env:GITHUB_ENV
          "WINDOWS_SDK_INCLUDE=$($sdkRoot.FullName)" >> $env:GITHUB_ENV
          "WINDOWS_SDK_LIB=$(${env:ProgramFiles(x86)})\Windows Kits\10\Lib\$($sdkRoot.Name)" >> $env:GITHUB_ENV

          Write-Host "Using MSVC: $($msvcRoot.FullName)"
          Write-Host "Using Windows SDK: $($sdkRoot.FullName)"


      # The shared editor core and ImGui kit, used by both editors; run once, here.
      - name: Editor core tier
        if: matrix.part == 'core'
        run: zig build test-editor-core -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: Editor kit tier
        if: matrix.part == 'core'
        run: zig build test-editor-kit -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: Map file tier
        if: matrix.part == 'core'
        run: zig build test-map-files -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # The app's own unit tests: view.zig's SDL event wiring against fake
      # bridges (WINDOWS.md 2), the panels' logic, Test in game's launch and
      # exit handling, BK_EDITOR_AUTO's parser. No engine or GPU.
      - name: Map editor unit tier
        if: matrix.part == 'core'
        run: zig build test-map-editor-view test-map-editor-panels test-map-editor-testlaunch test-map-editor-auto -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # The scripted editor scenarios (Map editor scenarios below) place their
      # clicks for the editor's own 1280x800 window, the size it gets on the
      # macOS runners. This runner's desktop is 1024x768, which shrinks the
      # window to 1008x681; there the right-hand panels start at x=688 and
      # points like M2's dblclick=c200x-250 land on them (CI 37155733296: a
      # click into the Properties panel's x field left the road tool with no
      # point in hand). A 1920x1080 desktop gives the window its full size.
      - name: Desktop large enough for the editor's window
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class BkDisplay {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;
                  public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
                  public int dmDisplayFlags; public int dmDisplayFrequency;
                  public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;
                  public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
              // The primary display's mode now (ENUM_CURRENT_SETTINGS, device null:
              // done here, as PowerShell would pass a null string as "").
              public static DEVMODE Current() {
                  DEVMODE dm = new DEVMODE();
                  dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (!EnumDisplaySettings(null, -1, ref dm)) throw new Exception("EnumDisplaySettings failed: " + Marshal.GetLastWin32Error());
                  return dm;
              }
              public static int Change(int width, int height) {
                  DEVMODE dm = Current();
                  dm.dmPelsWidth = width;
                  dm.dmPelsHeight = height;
                  dm.dmFields = 0x00080000 | 0x00100000; // DM_PELSWIDTH | DM_PELSHEIGHT
                  return ChangeDisplaySettings(ref dm, 0);
              }
          }
          "@
          $before = [BkDisplay]::Current()
          Write-Host "desktop before: $($before.dmPelsWidth)x$($before.dmPelsHeight)"
          $result = [BkDisplay]::Change(1920, 1080)
          if ($result -ne 0) { throw "ChangeDisplaySettings to 1920x1080 returned $result" }
          $now = [BkDisplay]::Current()
          Write-Host "desktop now: $($now.dmPelsWidth)x$($now.dmPelsHeight)"
          if ($now.dmPelsWidth -lt 1280 -or $now.dmPelsHeight -lt 900) { throw "the desktop is still $($now.dmPelsWidth)x$($now.dmPelsHeight)" }


      # MapEditor itself: the engine started hidden with ImGui over it, one
      # frame captured as presented and checked for both.
      - name: Map editor host
        if: matrix.part == 'host'
        run: zig build map-editor-host-check -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # MapEditor's interactive loop, hidden, driven by scripted SDL events:
      # paint, place, select, drag, turn, delete, undo it all, save, reopen.
      - name: Map editor smoke
        if: matrix.part == 'host'
        run: zig build map-editor-smoke -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # T-03-14-03: the packaged MapEditor.exe opens no console on a normal
      # double-click (configureMapEditorExecutable's .windows subsystem) -
      # confirmed by reading its own PE header rather than trusting the build
      # config alone. e_lfanew (the PE signature's offset) sits at DOS header
      # offset 0x3C; the Subsystem WORD sits 0x44 into the Optional Header,
      # which itself starts right after the 4-byte PE signature and the
      # 20-byte COFF header, i.e. at e_lfanew + 0x5C. 2 is
      # IMAGE_SUBSYSTEM_WINDOWS_GUI (winnt.h) - the map-editor-host-check step
      # above already built and staged this exact binary.
      - name: Map editor is a GUI program
        if: matrix.part == 'host'
        shell: pwsh
        run: |
          $exePath = "zig-out/game/windows/x86_64/debug/MapEditor.exe"
          if (-not (Test-Path $exePath)) { throw "staged MapEditor.exe not found at $exePath" }
          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          $eLfanew = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystemOffset = $eLfanew + 0x5C
          $subsystem = [BitConverter]::ToUInt16($bytes, $subsystemOffset)
          Write-Host "MapEditor.exe subsystem: $subsystem (2 = IMAGE_SUBSYSTEM_WINDOWS_GUI)"
          if ($subsystem -ne 2) { throw "MapEditor.exe subsystem is $subsystem, expected 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI)" }


      # The editor core driving the real engine through the Zig adapter.
      - name: Map editor engine tier
        if: matrix.part == 'host'
        run: zig build test-map-editor-engine -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # The scripted editor scenarios (05-REVIEW WR-D05): BK_EDITOR_AUTO's M1, M2
      # and M3 scripts, one after the other (each step depends on the one before,
      # so two engines never start at once), with their do=/expect= predicates.
      - name: Map editor scenarios
        if: matrix.part == 'scenarios'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build map-editor-m3-auto -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # The real Game playing what the editor saved: M1's placed unit, M2's
      # BK_MAP_TRACE report, and M3's railroad with fewer than two control
      # points (D-33, the CRailroadGraphConstructor crash) - its regression gate.
      - name: Game reads the editor's maps
        if: matrix.part == 'reads'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build map-editor-game-reads-it-m3 -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: Build the Map Editor overlay spike
        if: matrix.part == 'host'
        run: zig build editor-overlay-spike-build -Dtarget=x86_64-windows-msvc "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # Moved from windows-game (2026-10-08), the longest job: this job builds the
      # debug engine anyway, and the generator is the Map Editor's area.
      # Debug-only: NI_ASSERT lives in the debug build alone (RC2's
      # SRMMiniMapCreateParameter guard). kharkov42 selects its chapter's
      # four summer_ukraine templates (defend00, defend01, escort00, hunt00)
      # at three difficulties, 12 cases, so the assert runs on the revived
      # mission types without paying for a debug `all` sweep (about 3 h; see
      # Task 5's report). only=summer_ukraine would also match the
      # summer_ukraine\securearea* template paths (setting summer_russia),
      # about 96 cases.
      - name: Random missions tier (debug asserts)
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-windows-msvc -Dtest-mode=run -Drandom-missions-sweep=only=kharkov42 "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      # Moved from the Game job (2026-10-08) and run on the debug build, which this job
      # makes anyway: in release they reused the Game job's release build (under a minute
      # each), and the debug build checks the engine's asserts too.
      # The map editor's composers (05-09, 05-10): every shipped template, graph,
      # container and field set read, written and read again through the editor's
      # own records and compared (bytes included), and an authored set generated
      # from twice with one seed and compared byte for byte.
      - name: RMG composer round trip
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-rmg-composer-roundtrip -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: RMG determinism
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-rmg-determinism -Dtarget=x86_64-windows-msvc -Dtest-mode=run "-Dmsvc-include=$env:MSVC_INCLUDE" "-Dwindows-sdk-include=$env:WINDOWS_SDK_INCLUDE" "-Dmsvc-lib=$env:MSVC_LIB" "-Dwindows-sdk-lib=$env:WINDOWS_SDK_LIB"


      - name: Upload generated outputs
        # Only when the part failed: on Windows the upload alone took 5.5 minutes.
        if: failure()
