name: Cross-platform validation

# Since 2026-10-17 the jobs are gated by the changes job below (per-area
# path filters; Windows and macOS only on dispatch, main and PRs).
# The full matrix runs on every push and PR again (2026-10-12): the
# ci-failing.yml companion that scoped branch pushes to the open Linux x64
# failures is deleted, both of them green (38286700953's Resource Editor and
# 38313539472's Game), and the SEGV behind the Game's flakiness is addressed
# at the loader (VK_DRIVER_FILES=lvp) and the allocator (no stack capture on
# the DWARF platforms).
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new run on the same branch supersedes the previous one: no stacking.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


# One job per platform and product, named "<platform> - Game", "- Resource Editor" and
# "- Map Editor", so a run shows at a glance what works where. A combination that is not
# tested has a job that never runs (if: false) and says why in its name. Decision 2026-10-08.
#
# The fan-out (2026-10-18, CI-FANOUT-DESIGN.md): on Linux x64, Windows MSVC and macOS arm64
# a <platform>-build job compiles every tier once (-Dtest-mode=compile plus the installs),
# saves the caches and uploads them; each product job is a matrix of parts that downloads
# the build and runs only its own steps (if: matrix.part == ...), so no product job compiles
# the engine again. The tiers that set the wall time run in slices side by side:
# -Deditor-bridge-shard, -Dresource-bridge-shard and -Drandom-missions-sweep=shard=k/n.
# Every restored or unpacked cache goes through tools/zig/cache_restat.zig first: without
# it Zig 0.17 compiles every C++ object again on a new checkout, which is what the restored
# caches never saved (23 to 45 minutes per job). Run 39035514549 before all this: 151
# minutes and cut off; the target is under an hour.
jobs:

  # Which product areas a push or PR touched (2026-10-17). Every product job
  # needs this one and runs when the run was dispatched, the push is to main,
  # or its area changed; Windows and macOS (10x and 2x billed minutes)
  # additionally skip plain feature-branch pushes and run only on dispatch,
  # main and pull requests. The mapping errs towards running:
  #   core: anything that is not docs, not Sources/editor and not ELK-only,
  #     so the engine, Data, tools/zig, vendor, build.zig and this workflow
  #     all run every job. Unclassified paths land here too.
  #   editors-shared: Sources/editor, which the Resource Editor, Map Editor
  #     and platform jobs test (test-editor-core, -kit, test-resource-core)
  #     and windows-game packages (package-game-editors).
  #   elk: Sources/elk and Data/ELK; no job tests ELK, but windows-game
  #     stages Sources/elk/ELK.exe into its package.
  #   code: anything that is not docs; gates the Linux arm64 platform job.
  # engine, tools and planning are reported for the run log only. The
  # outputs are empty on dispatch and main, where every job is forced anyway.
  changes:
    name: "Changed areas"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.areas.outputs.engine }}
      elk: ${{ steps.areas.outputs.elk }}
      editors-shared: ${{ steps.areas.outputs.editors-shared }}
      tools: ${{ steps.areas.outputs.tools }}
      planning: ${{ steps.areas.outputs.planning }}
      core: ${{ steps.rest.outputs.core }}
      code: ${{ steps.rest.outputs.code }}
    steps:
      - name: Check out source
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          filter: blob:none
      - name: Areas
        id: areas
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            engine:
              - 'Sources/src/**'
              - 'Data/**'
            elk:
              - 'Sources/elk/**'
              - 'Sources/editor/elk/**'
              - 'Data/ELK/**'
              - 'Data/Textes/**'
            editors-shared:
              - 'Sources/editor/**'
            tools:
              - 'tools/zig/**'
              - 'Sources/src/FontAtlas/**'
              - 'Sources/src/ResourceModel/**'
              - 'vendor/**'
            planning:
              - '.planning/**'
              - 'docs/**'
              - '*.md'
      # A file counts for core or code when it matches none of the negated
      # patterns, which needs the 'every' quantifier and so a second step.
      - name: Everything else
        id: rest
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            core:
              - '!.planning/**'
              - '!docs/**'
              - '!*.md'
              - '!Sources/editor/**'
              - '!Sources/elk/**'
              - '!Data/ELK/**'
            code:
              - '!.planning/**'
              - '!docs/**'
              - '!*.md'

  # The localisation gate (M002 D063) has no area gate: it is cheap (plain Zig, no engine build,
  # no Data beyond Data/ELK) and a docs-only or translation-only push, which no product job runs
  # for, is exactly what can break it. It needs `changes` only to sit after it in the graph.
  l10n-check:
    needs: [changes]
    name: "Linux x64 - l10n-check"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            # build.zig reads the engine's .vcxproj files while it evaluates its graph, so
            # Sources is needed even though no engine step runs. Measured 2026-10-20 in a
            # sparse worktree: this list builds the steps below. The S08 document sets also
            # read Data/Editor/TestProjects/**/README*.md (22 doc-missing findings without it).
            # Since M004 S04 the job links bk_text (libc, the C++ runtime, HarfBuzz) for the fit rule:
            # it reads Data/UI (the layouts) and Data/Fonts (test-l10n-font), measured 2026-10-22.
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            /Data/ELK/
            /Data/Fonts/
            /Data/UI/
            /Data/Editor/TestProjects/
            # Since the checker takes the English the Game ships (2026-10-25), it reads the text
            # trees too: their .txt files only, a few MB (2,139 stale findings without them).
            /Data/Textes/
            /Data/Scenarios/**/*.txt
            /Data/Units/**/*.txt
            /Data/Buildings/**/*.txt
            /Data/Medals/**/*.txt
            /Data/Objects/**/*.txt
            /Data/movies/*.txt
          sparse-checkout-cone-mode: false

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Localisation gate
        run: zig build l10n-check test-l10n-check test-l10n-fit test-l10n-font test-l10n-glossary -Dtarget=x86_64-linux-gnu -Dtest-mode=run --summary new

  linux-build:
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true') || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true') || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true') || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (needs.changes.outputs.core == 'true' || needs.changes.outputs.elk == 'true')) || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (needs.changes.outputs.core == 'true' || needs.changes.outputs.tools == 'true'))
    name: "Linux x64 - build"
    runs-on: ubuntu-24.04
    # Compiles every tier of the three product jobs once (-Dtest-mode=compile)
    # and hands the caches to them; the only job that saves the caches.
    timeout-minutes: 120
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400


      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed. resource-editor-game-reads-it starts
            # the game, so ELK, AmericanELK and movies/progress are back, as on the Windows engine job.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/AmericanELK/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false



      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils xvfb mesa-vulkan-drivers libvulkan1



      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version



      # The month in the build cache's key: see the key below.
      - name: Cache month
        id: cache-month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig build cache
        id: zig-build-cache
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-



      - name: Restore Unix Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast



      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Compile the tiers
        shell: bash
        run: zig build bk-font-game-reads-it mod-compat-game-reads-it editor-overlay-spike-build elk-game-reads-it elk-l10n-auto elk-smoke gfxgpu-factory-test install-game install-language-mods install-map-editor install-resource-editor map-editor-host-check map-editor-l10n-auto resource-editor-auto-3rd resource-editor-auto-3rv resource-editor-auto-bdg resource-editor-auto-bld resource-editor-auto-cgc resource-editor-auto-chc resource-editor-auto-core resource-editor-auto-eff resource-editor-auto-fnc resource-editor-auto-gui resource-editor-auto-mdc resource-editor-auto-mip resource-editor-auto-msh resource-editor-auto-obt resource-editor-auto-pcp resource-editor-auto-spt resource-editor-auto-til resource-editor-auto-unt resource-editor-auto-wpn resource-editor-batch resource-editor-game-reads-it resource-editor-host-check resource-editor-l10n-auto resource-editor-smoke test-bk-font test-bk-image test-bk-l10n test-bk-map test-bk-memory test-bk-memory-c-sources test-bk-memory-import-audit test-bk-memory-zig test-bk-memory-zig-host test-bk-pak test-bk-sprite test-bk-table test-bk-tools test-bk-tools-l10n test-bk-video test-editor-bridge test-editor-core test-editor-kit test-elk-app test-elk-core test-gfxgpu-core test-l10n-font test-l10n-measure test-map-editor-auto test-map-editor-engine test-map-editor-panels test-map-editor-testlaunch test-map-editor-view test-map-files test-mission-data test-platform-debug test-platform-files test-platform-foundation test-platform-modules test-platform-system test-resource-bridge test-resource-core test-resource-mod-roundtrip test-resource-model test-rmg-composer-roundtrip test-rmg-determinism test-season-textures test-stage verify-runtime -Dtest-mode=compile -Dtarget=x86_64-linux-gnu --summary new

      - name: Compile the tiers with --release=fast
        shell: bash
        run: zig build install-game test-random-missions -Dtest-mode=compile -Dtarget=x86_64-linux-gnu --release=fast --summary new



      # Saved from main only, as in windows-game, and before the slow tail of the job.
      - name: Save Zig build cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}



      - name: Save Unix Zig global cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}

      # The fan-out (CI-FANOUT-DESIGN.md): the tier jobs download this build and
      # run their tiers from it without compiling. The repository's .zig-cache and
      # zig-pkg go in one archive, the global cache in another.
      - name: Pack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          zstd --version
          du -sh .zig-cache zig-pkg "$gparent/zig" || true
          mkdir -p "$RUNNER_TEMP/bk-build"
          tar -cf - .zig-cache zig-pkg | zstd -T0 -1 -q -o "$RUNNER_TEMP/bk-build/build.tar.zst"
          tar -C "$gparent" -cf - zig | zstd -T0 -1 -q -o "$RUNNER_TEMP/bk-build/global.tar.zst"
          ls -l "$RUNNER_TEMP/bk-build"
          echo "pack took $(( $(date +%s) - start )) s"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: ${{ runner.temp }}/bk-build
          compression-level: 0
          retention-days: 1

  linux-game:
    needs: [changes, linux-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true'
    name: "Linux x64 - Game (${{ matrix.label }})"
    runs-on: ubuntu-24.04
    # 33 minutes before the Resource Editor's engine-hosted tiers joined (run 37603215218);
    # they render on lavapipe, a CPU rasterizer, so give them room.
    # Split 2026-10-08: the Resource Editor and Map Editor run beside this job, in
    # linux-resource-editor and linux-map-editor.
    timeout-minutes: 60


    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "platform", label: "platform tests", shard: "", sweep: "all" }
          - { part: "engine", label: "engine tier", shard: "", sweep: "all" }
          - { part: "random", label: "random missions", shard: "", sweep: "all" }
          - { part: "l10n-1", label: "languages en to hi", shard: "", sweep: "all" }
          - { part: "l10n-2", label: "languages es to id", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400


      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed. resource-editor-game-reads-it starts
            # the game, so ELK, AmericanELK and movies/progress are back, as on the Windows engine job.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/AmericanELK/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false



      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils xvfb mesa-vulkan-drivers libvulkan1 libharfbuzz-bin



      # No GPU here, so a virtual X display and Mesa's software Vulkan (lavapipe) give SDL a device:
      # the engine-hosted resource tiers below then run for real, and BK_REQUIRE_ENGINE makes a
      # "skipped: no GPU device" fail instead of pass. VK_DRIVER_FILES pins the loader to
      # lavapipe: the image also carries the gfxstream ICD (the /dev/dxg host-GPU driver), whose
      # enumeration ran vkCreateInstance's ICD code whose allocations route through BkMemory's
      # hooked operator new from a foreign thread - the measured startup SEGV of the random
      # missions tier (38307115498's crash backtrace: gfxstream new -> bk_mem_alloc).
      - name: Virtual display and software Vulkan
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "SDL_VIDEO_DRIVER=x11" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          ls /usr/share/vulkan/icd.d/



      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast



      - name: Run StreamIO filesystem tests
        if: matrix.part == 'platform'
        run: zig build test-platform-files -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Run runtime module contract tests
        if: matrix.part == 'platform'
        run: zig build test-platform-modules -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Run platform foundation matrix
        if: matrix.part == 'platform'
        run: zig build test-platform-foundation -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Verify native runtime layout
        if: matrix.part == 'platform'
        run: zig build verify-runtime -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Run native staging tests
        if: matrix.part == 'platform'
        run: zig build test-stage -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Run diagnostics facade tests
        if: matrix.part == 'platform'
        run: zig build test-platform-debug -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run system facade tests
        if: matrix.part == 'platform'
        run: zig build test-platform-system test-unicode-paths test-mods-paths -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Run GFX GPU effect table tests
        if: matrix.part == 'platform'
        run: zig build test-gfxgpu-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Text precedence under a gameplay mod and a language
        if: matrix.part == 'platform'
        run: zig build test-text-precedence -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: The Remastered option's rules
        if: matrix.part == 'platform'
        run: zig build test-remastered -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: The replay core's random state and state hashes
        if: matrix.part == 'platform'
        run: zig build test-replay-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Mission data tier
        if: matrix.part == 'platform'
        run: zig build test-mission-data -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      # New on Linux (2026-10-08): the Game's own tiers on lavapipe, as on Windows and macOS.
      - name: Engine tier
        if: matrix.part == 'engine'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-editor-bridge -Dtarget=x86_64-linux-gnu -Dtest-mode=run ${{ matrix.shard }}



      # Run 37738226423 lost the runner twice here, both times after about 466 missions
      # (leningrad securearea05), with no message: the memory is logged every 20 seconds
      # to see whether it runs out.
      - name: Random missions tier
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: |
          ( while sleep 20; do echo "memory: $(free -m | awk '/Mem:/ {print $3 " MiB used, " $7 " MiB available"}'), largest: $(ps -eo rss=,comm= --sort=-rss | head -1)"; done ) &
          ulimit -c unlimited
          cat /proc/sys/kernel/core_pattern
          zig build test-random-missions -Dtarget=x86_64-linux-gnu --release=fast -Dtest-mode=run -Drandom-missions-sweep=${{ matrix.sweep }} || code=$?
          for f in core core.*; do [ -f "$f" ] && gzip -1 "$f" && echo "core kept: $f.gz"; done
          exit ${code:-0}



      # M002 S09: the real Game on English and the nine language mods, one step per language.
      # The shards measure against hb-view's rasters (libharfbuzz-bin above) and render on
      # lavapipe; the mods are installed first, and split over two parts for the 60 minutes.
      - name: Install the language mods
        if: contains(fromJSON('["l10n-1", "l10n-2"]'), matrix.part)
        run: zig build install-game install-language-mods -Dtarget=x86_64-linux-gnu


      - name: Game reads its languages (en)
        if: matrix.part == 'l10n-1'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-en -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (ru)
        if: matrix.part == 'l10n-1'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-ru -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (zh-hans)
        if: matrix.part == 'l10n-1'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-zh-hans -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (ja)
        if: matrix.part == 'l10n-1'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-ja -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (hi)
        if: matrix.part == 'l10n-1'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-hi -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (es)
        if: matrix.part == 'l10n-2'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-es -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (fr)
        if: matrix.part == 'l10n-2'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-fr -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (de)
        if: matrix.part == 'l10n-2'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-de -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (pt-br)
        if: matrix.part == 'l10n-2'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-pt-br -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads its languages (id)
        if: matrix.part == 'l10n-2'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build l10n-game-reads-it-id -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      # The leak gate: one template generated and opened 20 times over, the same maps every round;
      # the test fails if the heap grows over the last 10 rounds (tools/zig/random_missions_test.cpp).
      - name: Random missions leak gate
        if: matrix.part == 'random'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-linux-gnu --release=fast -Dtest-mode=run "-Drandom-missions-sweep=only=summer_ukraine\securearea00" -Drandom-missions-repeat=20



      # The random-missions SEGV (runs 37891155952, 38216827886) died within
      # its first minutes, in a --release=fast binary, before the first case
      # line printed. The tier step now saves a core (ulimit -c unlimited) and
      # this step post-mortems the true crash core when one survived - a gdb
      # re-run never reproduced it (run 38277218163: gdb ran 15 minutes clean
      # past case 620). While the tier is green it costs nothing. Kept and
      # updated in verbatim mirror with ci-failing.yml's linux-game job.
      - name: Backtrace the random missions SEGV
        if: matrix.part == 'random' && (failure())
        run: |
          sudo apt-get install -y --no-install-recommends gdb systemd-coredump
          cd zig-out/game/linux/x86_64/release
          if coredumpctl list random-missions-test 2>/dev/null | tail -3; then
            if coredumpctl dump random-missions-test /tmp/bk-core; then
              # The true crash's core, fetched from the coredump journal.
              cd /tmp && timeout 900 gdb -batch -ex 'set pagination off' -ex 'set confirm off' -ex 'thread apply all bt' -ex 'info threads' --exec=/home/runner/work/Blitzkrieg/Blitzkrieg/zig-out/game/linux/x86_64/release/random-missions-test --core=/tmp/bk-core 2>&1 | tee gdb-random-missions.log || true
            fi
          fi
          cd zig-out/game/linux/x86_64/release
          GZ=$(ls -t core*.gz core 2>/dev/null | head -1)
          if [ -n "$GZ" ]; then
            case "$GZ" in *.gz) gunzip -kf "$GZ"; G="${GZ%.gz}";; *) G="$GZ";; esac
            echo "=== post-mortem of the step-kept core: $G"
            timeout 900 gdb -batch -ex 'set pagination off' -ex 'set confirm off' -ex 'thread apply all bt' -ex 'info threads' --exec=./random-missions-test --core="$G" 2>&1 | tee -a gdb-random-missions.log || true
          elif [ ! -s gdb-random-missions.log ]; then
            echo "=== no core survived and nothing was printed; re-running under gdb (the race hides there)"
            timeout 1800 gdb -batch -ex 'set pagination off' -ex 'set confirm off' -ex run -ex 'thread apply all bt' --args ./random-missions-test . /home/runner/work/Blitzkrieg/Blitzkrieg/zig-out/local-test all 2>&1 | tee gdb-random-missions.log || true
          fi
          echo "=== last frames"
          tail -160 gdb-random-missions.log || true



      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        if: matrix.part == 'platform'
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-linux-gnu



      - name: Run GFX GPU factory test
        if: matrix.part == 'platform'
        id: gfxgpu-factory-test
        run: zig build gfxgpu-factory-test -Dtarget=x86_64-linux-gnu -Dtest-mode=run



      - name: Backtrace the GFX GPU factory test
        if: matrix.part == 'platform' && (failure() && steps.gfxgpu-factory-test.outcome == 'failure')
        run: |
          sudo apt-get install -y --no-install-recommends gdb binutils
          echo "=== ld.so init/fini calls, with the shared-object finalizer tracing its handle"
          BK_SO_FINALIZE_TRACE=1 LD_DEBUG=files zig-out/bin/gfxgpu-factory-test zig-out/lib/libGFXGPU.so 2>&1 | grep -iE "calling (init|fini)|finalize" | tail -20 || true
          echo "=== libGFXGPU.so: fini tags, finalizer and dso_handle symbols, handle passed to __cxa_atexit"
          readelf -dW zig-out/lib/libGFXGPU.so | grep -iE "fini|init" || true
          nm -C zig-out/lib/libGFXGPU.so | grep -iE "FinalizeSharedObject|__dso_handle|__cxa_(atexit|finalize)" || true
          readelf -xW .fini_array zig-out/lib/libGFXGPU.so || true
          objdump -dr -C zig-out/lib/libGFXGPU.so | grep -B6 -E "call.*__cxa_atexit" | grep -E "__dso_handle|__cxa_atexit|lea|mov" | head -30 || true
          objdump -d -C zig-out/lib/libGFXGPU.so --disassemble='FinalizeSharedObject()' | head -40 || true
          echo "=== gdb"
          gdb -batch -ex run -ex 'thread apply all bt' -ex 'info sharedlibrary' --args zig-out/bin/gfxgpu-factory-test zig-out/lib/libGFXGPU.so 2>&1 | tee gdb.log || true
          echo "=== fault address resolved against the objects the harness listed before dlclose"
          fault=$(grep -m1 -oE '^#0 +0x[0-9a-f]+' gdb.log | grep -oE '0x[0-9a-f]+' || true)
          grep 'gfxgpu-factory-test: object ' gdb.log | while read -r _ _ base path; do
            [ -n "$fault" ] || break
            off=$(( fault - base ))
            if [ "$off" -ge 0 ] && [ "$off" -lt 33554432 ]; then
              printf 'fault %s = %s + 0x%x\n' "$fault" "$path" "$off"
              [ -f "$path" ] && addr2line -f -C -e "$path" "$(printf 0x%x "$off")" || true
              [ -f "$path" ] && nm -nC --defined-only "$path" | awk -v o="$off" 'BEGIN{o=o+0} {a=strtonum("0x"$1); if (a<=o) last=$0} END{print "nearest symbol at or below: " last}' || true
            fi
          done



      - name: Upload generated outputs
        # Only when the part failed: on Windows the upload alone took 5.5 minutes.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-game-outputs-${{ matrix.part }}
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore


      - name: BkMemory Zig tests
        if: matrix.part == 'platform'
        run: zig build test-bk-memory-zig -Dtarget=x86_64-linux-gnu -Dtest-mode=run


      - name: BkMemory cross-module test
        if: matrix.part == 'platform'
        run: zig build test-bk-memory -Dtarget=x86_64-linux-gnu -Dtest-mode=run


      - name: BkMemory Zig host
        if: matrix.part == 'platform'
        run: zig build test-bk-memory-zig-host -Dtarget=x86_64-linux-gnu -Dtest-mode=run


      - name: BkMemory in the C libraries
        if: matrix.part == 'platform'
        run: zig build test-bk-memory-c-sources -Dtarget=x86_64-linux-gnu -Dtest-mode=run


      - name: BkMemory import audit tests
        if: matrix.part == 'platform'
        run: zig build test-bk-memory-import-audit -Dtarget=x86_64-linux-gnu -Dtest-mode=run

  linux-resource-editor:
    needs: [changes, linux-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'
    name: "Linux x64 - Resource Editor (${{ matrix.label }})"
    runs-on: ubuntu-24.04
    # Split from linux-game (2026-10-08) so each product shows its own result. It restores
    # the caches linux-game saves and does not save its own. The engine renders on lavapipe.
    timeout-minutes: 60

    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "bridge", label: "core, model and bridge tiers", shard: "", sweep: "all" }
          - { part: "editor-1", label: "editor and autos 1", shard: "", sweep: "all" }
          - { part: "editor-2", label: "autos 2 and the game", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed. resource-editor-game-reads-it starts
            # the game, so ELK, AmericanELK and movies/progress are back, as on the Windows engine job.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/AmericanELK/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils xvfb mesa-vulkan-drivers libvulkan1 libharfbuzz-bin


      # No GPU here, so a virtual X display and Mesa's software Vulkan (lavapipe) give SDL a device:
      # the engine-hosted resource tiers below then run for real, and BK_REQUIRE_ENGINE makes a
      # "skipped: no GPU device" fail instead of pass. VK_DRIVER_FILES pins the loader to
      # lavapipe: the image also carries the gfxstream ICD (the /dev/dxg host-GPU driver), whose
      # enumeration ran vkCreateInstance's ICD code whose allocations route through BkMemory's
      # hooked operator new from a foreign thread - the measured startup SEGV of the random
      # missions tier (38307115498's crash backtrace: gfxstream new -> bk_mem_alloc).
      - name: Virtual display and software Vulkan
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "SDL_VIDEO_DRIVER=x11" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          ls /usr/share/vulkan/icd.d/


      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Resource editor core tier
        if: matrix.part == 'bridge'
        run: zig build test-resource-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run


      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        if: matrix.part == 'bridge'
        run: zig build test-resource-model -Dtarget=x86_64-linux-gnu -Dtest-mode=run


      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview), on lavapipe.
      - name: Resource bridge tier
        if: matrix.part == 'bridge'
        env:
          BK_REQUIRE_ENGINE: "1"
        # This step boots the editors in-process with GPU readbacks; it has
        # burned a whole runner in a silent in-process stall (the 24-frame
        # stack-capture era). A bounded step turns that into a failure with
        # the log preserved: 45 minutes covers the coldest legit run measured
        # (34 minutes for the model tier on this job).
        run: timeout 2700 zig build test-resource-bridge -Dtarget=x86_64-linux-gnu -Dtest-mode=run ${{ matrix.shard }}


      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
