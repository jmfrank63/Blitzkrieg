  linux-arm-platform:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.code == 'true'
    name: "Linux arm64 - platform only"
    # Raspberry Pi class target. GitHub's arm64 Linux runner executes the suites
    # natively, so this job proves the aarch64 build works rather than only that
    # it compiles.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90


    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Verify arm64 host
        run: |
          test "$(uname -m)" = "aarch64"
          uname -a


      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils


      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-aarch64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-aarch64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version


      # The month in the build cache's key: see the key below.
      - name: Cache month
        id: cache-month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig build cache
        id: zig-build-cache
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache
          key: ${{ runner.os }}-aarch64-linux-gnu-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-aarch64-linux-gnu-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-


      - name: Restore Unix Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-aarch64-linux-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-linux-gnu-zig-global-0.17.0-

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig


      - name: Run StreamIO filesystem tests
        run: zig build test-platform-files -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Run runtime module contract tests
        run: zig build test-platform-modules -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Run platform foundation matrix
        run: zig build test-platform-foundation -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Verify native runtime layout
        run: zig build verify-runtime -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Run native staging tests
        run: zig build test-stage -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Run diagnostics facade tests
        run: zig build test-platform-debug -Dtarget=aarch64-linux-gnu -Dtest-mode=run

      - name: Run system facade tests
        run: zig build test-platform-system test-unicode-paths test-mods-paths -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Run GFX GPU effect table tests
        run: zig build test-gfxgpu-core -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Map file tier
        run: zig build test-map-files -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Editor core tier
        run: zig build test-editor-core -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Editor kit tier
        run: zig build test-editor-kit -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Resource editor core tier
        run: zig build test-resource-core -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      # S03 slice gate on the fifth engine target: the MFC fidelity sweep and the
      # D-11 comparator over shipped Data read through the engine's own readers.
      - name: Resource model tier
        run: zig build test-resource-model -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview). No GPU device here, so it
      # prints "skipped: no GPU device" and exits 0; it still has to build.
      - name: Resource bridge tier
        run: zig build test-resource-bridge -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        run: zig build test-resource-mod-roundtrip -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      - name: Build the Map Editor overlay spike
        run: zig build editor-overlay-spike-build -Dtarget=aarch64-linux-gnu


      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=aarch64-linux-gnu


      - name: Run GFX GPU factory test
        run: zig build gfxgpu-factory-test -Dtarget=aarch64-linux-gnu -Dtest-mode=run


      # Saved from main only, as in windows-game, and before the slow tail of the job.
      - name: Save Zig build cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}


      - name: Save Unix Zig global cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}


      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm-platform-outputs
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

