        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed. resource-editor-game-reads-it starts
            # the game, so ELK, AmericanELK and movies/progress are back, as on the Windows engine job.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/AmericanELK/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false


      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils xvfb mesa-vulkan-drivers libvulkan1 libharfbuzz-bin


      # No GPU here, so a virtual X display and Mesa's software Vulkan (lavapipe) give SDL a device:
      # the engine-hosted resource tiers below then run for real, and BK_REQUIRE_ENGINE makes a
      # "skipped: no GPU device" fail instead of pass. VK_DRIVER_FILES pins the loader to
      # lavapipe: the image also carries the gfxstream ICD (the /dev/dxg host-GPU driver), whose
      # enumeration ran vkCreateInstance's ICD code whose allocations route through BkMemory's
