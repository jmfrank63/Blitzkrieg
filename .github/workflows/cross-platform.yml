  macos-build:
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && needs.changes.outputs.core == 'true')) || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))) || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))) || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.elk == 'true'))) || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.tools == 'true')))
    name: "macOS arm64 - build"
    runs-on: macos-14
    # Compiles every tier of the three product jobs once (-Dtest-mode=compile)
    # and hands the caches to them; the only job that saves the caches.
    timeout-minutes: 120
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400


      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Localization/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            # The resource tiers read the Medals and Old (.unt) folders too.
            /Data/Medals/
            /Data/Old/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false



      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      # The restored Zig cache (21 GB on run 39370812748) plus a full rebuild
      # plus its packed copy filled the runner's disk when a change touched
      # every module (run 39376572656: "No space left on device" in Pack the
      # build). The image's other Xcode versions and the Android SDK are never
      # used here; removing them leaves room for both.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          keep=$(cd "$(xcode-select -p)/../.." && pwd -P)
          echo "selected Xcode: $keep"
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$keep" ] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf "$HOME/Library/Android"
          df -h /

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_host_arch="$(uname -m)"
          case "$zig_host_arch" in
            arm64) zig_host_arch="aarch64" ;;
            x86_64) zig_host_arch="x86_64" ;;
            *) echo "Unsupported macOS host architecture: $zig_host_arch" >&2; exit 1 ;;
          esac
          zig_archive="zig-${zig_host_arch}-macos-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-${zig_host_arch}-macos-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version



      # The month in the build cache's key: see the key below.
      - name: Cache month
        id: cache-month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig build cache
        id: zig-build-cache
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache
          key: ${{ runner.os }}-aarch64-macos-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-aarch64-macos-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-



      - name: Restore Unix Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-aarch64-macos-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-macos-zig-global-0.17.0-

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast



      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig



      - name: Configure macOS SDK sysroot
        run: echo "MACOS_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Compile the tiers
        shell: bash
        run: zig build bk-font-game-reads-it editor-overlay-spike-build elk-game-reads-it elk-l10n-auto elk-smoke gfxgpu-factory-test install-game install-language-mods install-map-editor install-resource-editor map-editor-host-check map-editor-l10n-auto resource-editor-auto-3rd resource-editor-auto-3rv resource-editor-auto-bdg resource-editor-auto-bld resource-editor-auto-cgc resource-editor-auto-chc resource-editor-auto-core resource-editor-auto-eff resource-editor-auto-fnc resource-editor-auto-gui resource-editor-auto-mdc resource-editor-auto-mip resource-editor-auto-msh resource-editor-auto-obt resource-editor-auto-pcp resource-editor-auto-spt resource-editor-auto-til resource-editor-auto-unt resource-editor-auto-wpn resource-editor-batch resource-editor-game-reads-it resource-editor-host-check resource-editor-l10n-auto resource-editor-smoke test-bk-font test-bk-image test-bk-l10n test-bk-map test-bk-memory test-bk-memory-c-sources test-bk-memory-import-audit test-bk-memory-zig test-bk-memory-zig-host test-bk-pak test-bk-sprite test-bk-table test-bk-tools test-bk-tools-l10n test-bk-video test-editor-bridge test-editor-core test-editor-kit test-elk-app test-elk-core test-gfxgpu-core test-l10n-measure test-map-editor-auto test-map-editor-engine test-map-editor-panels test-map-editor-testlaunch test-map-editor-view test-map-files test-platform-debug test-platform-events test-platform-files test-platform-foundation test-platform-modules test-platform-system test-resource-bridge test-resource-core test-resource-mod-roundtrip test-resource-model test-rmg-composer-roundtrip test-rmg-determinism test-season-textures test-stage verify-runtime -Dtest-mode=compile -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" -Dtarget=aarch64-macos --summary new

      - name: Compile the tiers with --release=fast
        shell: bash
        run: zig build install-game test-random-missions -Dtest-mode=compile -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" -Dtarget=aarch64-macos --release=fast --summary new



      # Saved from main only, as in windows-game, and before the slow tail of the job.
      - name: Save Zig build cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}



      - name: Save Unix Zig global cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}

      # The fan-out (CI-FANOUT-DESIGN.md): the tier jobs download this build and
      # run their tiers from it without compiling. The repository's .zig-cache and
      # zig-pkg go in one archive, the global cache in another.
      - name: Pack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          zstd --version
          du -sh .zig-cache zig-pkg "$gparent/zig" || true
          mkdir -p "$RUNNER_TEMP/bk-build"
          tar -cf - .zig-cache zig-pkg | zstd -T0 -1 -q -o "$RUNNER_TEMP/bk-build/build.tar.zst"
          tar -C "$gparent" -cf - zig | zstd -T0 -1 -q -o "$RUNNER_TEMP/bk-build/global.tar.zst"
          ls -l "$RUNNER_TEMP/bk-build"
          echo "pack took $(( $(date +%s) - start )) s"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: ${{ runner.temp }}/bk-build
          compression-level: 0
          retention-days: 1

