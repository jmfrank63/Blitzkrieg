    needs: [changes, macos-build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.tools == 'true'))
    name: "macOS arm64 - Tools (${{ matrix.label }})"
    runs-on: macos-14
    timeout-minutes: 60


    # Each zig build lists what it could not take from the cache.
    env:
      ZIG_BUILD_SUMMARY: new
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "all", label: "all tiers", shard: "", sweep: "all" }
    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400


      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            # test-bk-video converts these three movies; the rest of Sources/src/data stays out.
            /Sources/src/data/Movies/interface/smoke1.bik
            /Sources/src/data/Movies/transition/open.bik
            /Sources/src/data/Movies/transition/close.bik
            /tools/
            /vendor/
            /Localization/
            /Data/Maps/
            /Data/Terrain/sets/*/tileset.xml
            /Data/Terrain/sets/*/crosset.xml
            /Data/Scenarios/
            # The engine tier starts the whole game, so it needs nearly all of Data.
            # Measured 2026-09-21 by adding trees to a symlink farm until it ran
            # and taking them away until it stopped: 2.3 GB of the 2.8 GB tree,
            # everything but movies, Music, Old, Bugs and Medals. Scenarios is
            # included too, for the random missions tier. Only the two runners
            # that have a GPU device pay for it; the other three have none,
            # would skip, and keep the narrow checkout.
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            # stage.zig copies Data/THIRD-PARTY-NOTICES.txt to the install root
            # (tools/zig/verify_runtime.zig:40), so install-game fails without it.
            /Data/*.txt
            # The rest of the loose files at the top of Data. Listed by name
            # rather than as /Data/* - that would match the directories too and
            # pull the whole 2.8 GB tree back in.
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/AmericanELK/
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            # The resource tiers read the Medals and Old (.unt) folders too.
            /Data/Medals/
            /Data/Old/
            /Data/movies/progress/
            /Data/movies/*.txt
            /Data/Objects/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false



      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers

      # The macOS build is 7 GB packed and about 21 GB unpacked (run 39460191996:
      # "No space left on device" in a tier job's unpack). The build job frees the
      # image's spare Xcode versions and the Android SDK; each tier job does too.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          keep=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$keep" ] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf "$HOME/Library/Android"
          df -h /



      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_host_arch="$(uname -m)"
          case "$zig_host_arch" in
            arm64) zig_host_arch="aarch64" ;;
            x86_64) zig_host_arch="x86_64" ;;
            *) echo "Unsupported macOS host architecture: $zig_host_arch" >&2; exit 1 ;;
          esac
          zig_archive="zig-${zig_host_arch}-macos-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-${zig_host_arch}-macos-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: ${{ runner.temp }}/bk-build

      - name: Unpack the build
        shell: bash
        run: |
          start=$(date +%s)
          gparent="$HOME/.cache"
          mkdir -p "$gparent"
          zstd -dc "$RUNNER_TEMP/bk-build/build.tar.zst" | tar -xf -
          zstd -dc "$RUNNER_TEMP/bk-build/global.tar.zst" | tar -C "$gparent" -xf -
          rm -rf "$RUNNER_TEMP/bk-build"
          echo "unpack took $(( $(date +%s) - start )) s"

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast



      - name: Configure macOS SDK sysroot
        run: echo "MACOS_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"


      - name: Tools convention
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-tools -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-pak
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-pak -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-table
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-table -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-image
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-image -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-video
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-video -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-font
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-font -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-map
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-map -Dtarget=aarch64-macos -Dtest-mode=run


      - name: bk-sprite
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-sprite -Dtarget=aarch64-macos -Dtest-mode=run


      - name: The game reads bk-font's font
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" bk-font-game-reads-it -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Season textures
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-season-textures -Dtarget=aarch64-macos -Dtest-mode=run



      # D088: the measured tiers compare against hb-view's rasters; Homebrew's harfbuzz ships it.
      - name: Install hb-view
        if: matrix.part == 'all'
        run: |
          brew install harfbuzz
          command -v hb-view

      - name: bk-* string tables
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-l10n -Dtarget=aarch64-macos -Dtest-mode=run

      - name: bk-* tools in ten languages
        if: matrix.part == 'all'
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-bk-tools-l10n -Dtarget=aarch64-macos -Dtest-mode=run

      - name: l10n measures
        if: matrix.part == 'all'
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-l10n-measure -Dtarget=aarch64-macos -Dtest-mode=run


      - name: Upload generated outputs
        # Only when the part failed: on Windows the upload alone took 5.5 minutes.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-tools-outputs-${{ matrix.part }}
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

  windows-mingw-platform:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.editors-shared == 'true'))
    name: "Windows x64 MinGW - platform only"
    # The GNU Windows ABI. Zig ships its own mingw-w64 headers and import
    # libraries, so unlike the MSVC job this one needs no Visual Studio lookup.
    # It runs on Windows so the suites execute rather than only link.
    runs-on: windows-latest
    timeout-minutes: 60


    steps:
      # The partial clone fetches blobs lazily and has died mid-fetch on the
      # runners (curl 56 / RPC failed, run 38397700311's Intel job): HTTP/1.1
      # and a larger post buffer are the documented mitigations for that
      # flake, applied before any checkout in every job.
      - name: Harden git HTTP
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 157286400

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            /Data/icon.bmp
          sparse-checkout-cone-mode: false


      - name: Install Zig 0.17.0
        shell: pwsh
        run: |
          $zigVersion = "0.17.0"
          $zigArchive = "zig-x86_64-windows-$zigVersion.zip"
          $zigArchivePath = Join-Path $env:RUNNER_TEMP $zigArchive
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/$zigArchive" -OutFile $zigArchivePath
          Expand-Archive -LiteralPath $zigArchivePath -DestinationPath $env:RUNNER_TEMP -Force
          $zigHome = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$zigVersion"
          Add-Content -Path $env:GITHUB_PATH -Value $zigHome
          & (Join-Path $zigHome "zig.exe") version


      # The month in the build cache's key: see the key below.
      - name: Cache month
        id: cache-month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig build cache
        id: zig-build-cache
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-windows-gnu-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-x86_64-windows-gnu-zig-build-0.17.0-${{ steps.cache-month.outputs.month }}-


      - name: Restore Windows Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v6
        with:
          path: ~\AppData\Local\zig
          key: ${{ runner.os }}-x86_64-windows-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-windows-gnu-zig-global-0.17.0-

      # A restored or unpacked cache has new inodes and times, and Zig 0.17 then
      # compiles every C and C++ object again although no byte changed.
      # cache_restat writes the current stat into each manifest entry whose file
      # still hashes to the recorded digest, so only what really changed builds.
      - name: Restat the Zig cache
        shell: bash
        env:
          BK_RESTAT_VERBOSE: "1"
        run: zig run tools/zig/cache_restat.zig -O ReleaseFast


      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig


      - name: Run StreamIO filesystem tests
        run: zig build test-platform-files -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Run runtime module contract tests
        run: zig build test-platform-modules -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Run platform foundation matrix
        run: zig build test-platform-foundation -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Verify native runtime layout
        run: zig build verify-runtime -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Run native staging tests
        run: zig build test-stage -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Run diagnostics facade tests
        run: zig build test-platform-debug -Dtarget=x86_64-windows-gnu -Dtest-mode=run

      - name: Run system facade tests
        run: zig build test-platform-system test-unicode-paths test-mods-paths -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Run GFX GPU effect table tests
        run: zig build test-gfxgpu-core -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Editor core tier
        run: zig build test-editor-core -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Editor kit tier
        run: zig build test-editor-kit -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Resource editor core tier
        run: zig build test-resource-core -Dtarget=x86_64-windows-gnu -Dtest-mode=run


      - name: Build the Map Editor overlay spike
        run: zig build editor-overlay-spike-build -Dtarget=x86_64-windows-gnu


      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-windows-gnu


      # Saved from main only, as in windows-game, and before the slow tail of the job.
      - name: Save Zig build cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .zig-cache
          key: ${{ steps.zig-build-cache.outputs.cache-primary-key }}


      - name: Save Windows Zig global cache
        if: always() && github.ref == 'refs/heads/main' && steps.zig-global-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~\AppData\Local\zig
          key: ${{ steps.zig-global-cache.outputs.cache-primary-key }}


      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-mingw-platform-outputs
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

