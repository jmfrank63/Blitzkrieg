          path: .zig-cache
          key: ${{ runner.os }}-x86_64-macos-zig-build-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-macos-zig-build-0.16.0-

      - name: Restore Unix Zig global cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-macos-zig-global-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-macos-zig-global-0.16.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Configure macOS SDK sysroot
        run: echo "MACOS_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Compile StreamIO filesystem tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-files -Dtarget=x86_64-macos -Dtest-mode=compile

      - name: Run runtime module contract tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-modules -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Compile platform foundation matrix
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-foundation -Dtarget=x86_64-macos -Dtest-mode=compile

      - name: Verify native runtime layout
        run: zig build --sysroot "$MACOS_SYSROOT" verify-runtime -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Run native staging tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-stage -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Run diagnostics facade tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-platform-debug -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Run GFX GPU effect table tests
        run: zig build --sysroot "$MACOS_SYSROOT" test-gfxgpu-core -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Map file tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-map-files -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Editor core tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-editor-core -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Editor kit tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-editor-kit -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Resource editor core tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-core -Dtarget=x86_64-macos -Dtest-mode=run

      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-model -Dtarget=x86_64-macos -Dtest-mode=run

      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview). No GPU device here, so it
      # prints "skipped: no GPU device" and exits 0; it still has to build.
      - name: Resource bridge tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-bridge -Dtarget=x86_64-macos -Dtest-mode=run

      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        run: zig build --sysroot "$MACOS_SYSROOT" test-resource-mod-roundtrip -Dtarget=x86_64-macos -Dtest-mode=run

      - name: Build the Map Editor overlay spike
        run: zig build --sysroot "$MACOS_SYSROOT" editor-overlay-spike-build -Dtarget=x86_64-macos

      # Non-gating: reports whether this runner has a GPU device SDL can
      # use, so the engine and overlay tiers can be scheduled on fact
      # rather than on assumption. Never fails the build.
      - name: GPU device probe
        continue-on-error: true
        run: zig build --sysroot "$MACOS_SYSROOT" gpu-device-probe -Dtarget=x86_64-macos

      - name: Compile GFX GPU factory test
        run: zig build --sysroot "$MACOS_SYSROOT" gfxgpu-factory-test -Dtarget=x86_64-macos -Dtest-mode=compile

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-intel-platform-outputs
          path: zig-out
          if-no-files-found: ignore
