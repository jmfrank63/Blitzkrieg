      - name: Run GFX GPU effect table tests
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-gfxgpu-core -Dtarget=x86_64-macos -Dtest-mode=run


      - name: Map file tier
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-map-files -Dtarget=x86_64-macos -Dtest-mode=run


      - name: Editor core tier
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-editor-core -Dtarget=x86_64-macos -Dtest-mode=run


      - name: Editor kit tier
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-editor-kit -Dtarget=x86_64-macos -Dtest-mode=run


      - name: Resource editor core tier
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-resource-core -Dtarget=x86_64-macos -Dtest-mode=run


      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        run: zig build -Dsystem_include_path="$MACOS_SYSROOT/usr/include" -Dsystem_framework_path="$MACOS_SYSROOT/System/Library/Frameworks" -Dlibrary_path="$MACOS_SYSROOT/usr/lib" test-resource-model -Dtarget=x86_64-macos -Dtest-mode=run


      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview). No GPU device here, so it
      # prints "skipped: no GPU device" and exits 0; it still has to build.
      - name: Resource bridge tier
