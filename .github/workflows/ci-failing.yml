name: Failing-tier focus

# Temporary companion to cross-platform.yml (2026-10-12): with every job green
# except "Linux x64 - Game" and "Linux x64 - Resource Editor", branch pushes run
# only those two so fixes iterate on the failing part. Every step those two jobs
# pass consistently is skipped (if: inputs.full == true), so a push or a
# workflow_dispatch runs setup plus the failing tiers: the Resource Editor's
# bridge tier and the Game's random missions tier with its backtrace step.
# dispatch full=true runs everything these two jobs would. The full suite stays
# on pull_request to main and workflow_dispatch of cross-platform.yml. These two
# jobs mirror cross-platform.yml verbatim; delete this file once both are green
# on push and restore push triggers in cross-platform.yml.

on:
  push:
    branches: ['feat/**', 'fix/**']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every step, not only the currently failing tiers'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-game:
    name: "Linux x64 - Game"
    runs-on: ubuntu-24.04
    timeout-minutes: 180


    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed. resource-editor-game-reads-it starts
            # the game, so ELK, AmericanELK and movies/progress are back, as on the Windows engine job.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/AmericanELK/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/movies/progress/
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils xvfb mesa-vulkan-drivers libvulkan1

      # No GPU here, so a virtual X display and Mesa's software Vulkan (lavapipe) give SDL a device:
      # the engine-hosted resource tiers below then run for real, and BK_REQUIRE_ENGINE makes a
      # "skipped: no GPU device" fail instead of pass. VK_DRIVER_FILES pins the loader to
      # lavapipe: the image also carries the gfxstream ICD (the /dev/dxg host-GPU driver), whose
      # enumeration ran vkCreateInstance's ICD code whose allocations route through BkMemory's
      # hooked operator new from a foreign thread - the measured startup SEGV of the random
      # missions tier (38307115498's crash backtrace: gfxstream new -> bk_mem_alloc).
      - name: Virtual display and software Vulkan
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "SDL_VIDEO_DRIVER=x11" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          ls /usr/share/vulkan/icd.d/

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Restore Zig build cache
        id: zig-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-

      - name: Restore Unix Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-

      - name: Audit playable native residue
        if: inputs.full == true
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Run StreamIO filesystem tests
        if: inputs.full == true
        run: zig build test-platform-files -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run runtime module contract tests
        if: inputs.full == true
        run: zig build test-platform-modules -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run platform foundation matrix
        if: inputs.full == true
        run: zig build test-platform-foundation -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Verify native runtime layout
        if: inputs.full == true
        run: zig build verify-runtime -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run native staging tests
        if: inputs.full == true
        run: zig build test-stage -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run diagnostics facade tests
        if: inputs.full == true
        run: zig build test-platform-debug -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Run GFX GPU effect table tests
        if: inputs.full == true
        run: zig build test-gfxgpu-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Mission data tier
        if: inputs.full == true
        run: zig build test-mission-data -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # New on Linux (2026-10-08): the Game's own tiers on lavapipe, as on Windows and macOS.
      - name: Engine tier
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-editor-bridge -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # Run 37738226423 lost the runner twice here, both times after about 466 missions
      # (leningrad securearea05), with no message: the memory is logged every 20 seconds
      # to see whether it runs out.
      - name: Random missions tier
        env:
          BK_REQUIRE_ENGINE: "1"
        # ulimit -c unlimited so the startup SEGV (which struck before the
        # first case line in runs 37891155952, 38216827886 and 38277218163,
        # and never reproduces under a gdb re-run) leaves a core in the
        # installation the failure step below can post-mortem.
        run: |
          ( while sleep 20; do echo "memory: $(free -m | awk '/Mem:/ {print $3 " MiB used, " $7 " MiB available"}'), largest: $(ps -eo rss=,comm= --sort=-rss | head -1)"; done ) &
          ulimit -c unlimited
          cat /proc/sys/kernel/core_pattern
          zig build test-random-missions -Dtarget=x86_64-linux-gnu --release=fast -Dtest-mode=run -Drandom-missions-sweep=all || code=$?
          for f in core core.*; do [ -f "$f" ] && gzip -1 "$f" && echo "core kept: $f.gz"; done
          exit ${code:-0}

      # The leak gate: one template generated and opened 20 times over, the same maps every round;
      # the test fails if the heap grows over the last 10 rounds (tools/zig/random_missions_test.cpp).
      - name: Random missions leak gate
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-random-missions -Dtarget=x86_64-linux-gnu --release=fast -Dtest-mode=run "-Drandom-missions-sweep=only=summer_ukraine\securearea00" -Drandom-missions-repeat=20

      # The random-missions SEGV (runs 37891155952, 38216827886) died within
      # its first minutes, in a --release=fast binary, before the first case
      # line printed. A failure-only step re-runs the same executable under
      # gdb, bounded, so the next SEGV names its faulting frame instead of
      # dying silently; while the tier is green it costs nothing.
      - name: Backtrace the random missions SEGV
        if: failure()
        run: |
          sudo apt-get install -y --no-install-recommends gdb systemd-coredump
          cd zig-out/game/linux/x86_64/release
          if coredumpctl list random-missions-test 2>/dev/null | tail -3; then
            if coredumpctl dump random-missions-test /tmp/bk-core; then
              # The true crash's core, fetched from the coredump journal.
              cd /tmp && timeout 900 gdb -batch -ex 'set pagination off' -ex 'set confirm off' -ex 'thread apply all bt' -ex 'info threads' --exec=/home/runner/work/Blitzkrieg/Blitzkrieg/zig-out/game/linux/x86_64/release/random-missions-test --core=/tmp/bk-core 2>&1 | tee gdb-random-missions.log || true
            fi
          fi
          cd zig-out/game/linux/x86_64/release
          GZ=$(ls -t core*.gz core 2>/dev/null | head -1)
          if [ -n "$GZ" ]; then
            case "$GZ" in *.gz) gunzip -kf "$GZ"; G="${GZ%.gz}";; *) G="$GZ";; esac
            echo "=== post-mortem of the step-kept core: $G"
            timeout 900 gdb -batch -ex 'set pagination off' -ex 'set confirm off' -ex 'thread apply all bt' -ex 'info threads' --exec=./random-missions-test --core="$G" 2>&1 | tee -a gdb-random-missions.log || true
          elif [ ! -s gdb-random-missions.log ]; then
            echo "=== no core survived and nothing was printed; re-running under gdb (the race hides there)"
            timeout 1800 gdb -batch -ex 'set pagination off' -ex 'set confirm off' -ex run -ex 'thread apply all bt' --args ./random-missions-test . /home/runner/work/Blitzkrieg/Blitzkrieg/zig-out/local-test all 2>&1 | tee gdb-random-missions.log || true
          fi
          echo "=== last frames"
          tail -160 gdb-random-missions.log || true

      # Same rationale as the Resource Editor job's saves: the fast run's own
      # build (release-fast random missions here) is what the next push needs
      # warm. Saved even on failure: the compiled tree is worth the entry.
      - name: Save the failing-tier Zig build cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}

      - name: Save the failing-tier Unix Zig global cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}

      - name: GPU device probe
        if: inputs.full == true
        continue-on-error: true
        run: zig build gpu-device-probe -Dtarget=x86_64-linux-gnu

      - name: Run GFX GPU factory test
        if: inputs.full == true
        id: gfxgpu-factory-test
        run: zig build gfxgpu-factory-test -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-game-outputs
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore

  linux-resource-editor:
    name: "Linux x64 - Resource Editor"
    runs-on: ubuntu-24.04
    # Split from linux-game (2026-10-08) so each product shows its own result. It restores
    # the caches linux-game saves and does not save its own. The engine renders on lavapipe.
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /Sources/
            !/Sources/src/data/
            /tools/
            /vendor/
            # The resource tiers (test-resource-model, test-resource-bridge and the mod
            # round trip) read the shipped Data through the engine, and install-game stages
            # it. Measured 2026-10-07 in a sparse worktree: this list passes all three, and
            # dropping Sounds, Cursor, Icons, Fonts or Water makes one of them fail. ELK,
            # AmericanELK, movies, Music and Bugs are not needed. resource-editor-game-reads-it starts
            # the game, so ELK, AmericanELK and movies/progress are back, as on the Windows engine job.
            /Data/Maps/
            /Data/Scenarios/
            /Data/*.xml
            /Data/*.arr
            /Data/*.spp
            /Data/*.txt
            /Data/icon.bmp
            /Data/icon.png
            /Data/splash.bmp
            /Data/resource.description
            /Data/Bridges/
            /Data/Buildings/
            /Data/Configs/
            /Data/AmericanELK/
            /Data/Cursor/
            /Data/ELK/
            /Data/Editor/
            /Data/Effects/
            /Data/Fences/
            /Data/Fonts/
            /Data/Icons/
            /Data/Medals/
            /Data/movies/progress/
            /Data/Objects/
            /Data/Old/
            /Data/Sounds/
            /Data/Squads/
            /Data/Terrain/
            /Data/Textes/
            /Data/UI/
            /Data/Units/
            /Data/Water/
            /Data/Weapons/
          sparse-checkout-cone-mode: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libc++-dev libc++abi-dev curl xz-utils xvfb mesa-vulkan-drivers libvulkan1

      # No GPU here, so a virtual X display and Mesa's software Vulkan (lavapipe) give SDL a device:
      # the engine-hosted resource tiers below then run for real, and BK_REQUIRE_ENGINE makes a
      # "skipped: no GPU device" fail instead of pass. VK_DRIVER_FILES pins the loader to
      # lavapipe: the image also carries the gfxstream ICD (the /dev/dxg host-GPU driver), whose
      # enumeration ran vkCreateInstance's ICD code whose allocations route through BkMemory's
      # hooked operator new from a foreign thread - the measured startup SEGV of the random
      # missions tier (38307115498's crash backtrace: gfxstream new -> bk_mem_alloc).
      - name: Virtual display and software Vulkan
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "SDL_VIDEO_DRIVER=x11" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          ls /usr/share/vulkan/icd.d/

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          zig_archive="zig-x86_64-linux-0.17.0.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/0.17.0/${zig_archive}" \
            --output "${RUNNER_TEMP}/${zig_archive}"
          tar -xJf "${RUNNER_TEMP}/${zig_archive}" -C "${RUNNER_TEMP}"
          zig_home="${RUNNER_TEMP}/zig-x86_64-linux-0.17.0"
          export PATH="${zig_home}:$PATH"
          echo "$zig_home" >> "$GITHUB_PATH"
          zig version

      - name: Restore Zig build cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-

      - name: Restore Unix Zig global cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-

      - name: Audit playable native residue
        run: zig test tools/zig/runtime_platform_audit_test.zig

      - name: Resource editor core tier
        if: inputs.full == true
        run: zig build test-resource-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # S03 slice gate: Sources/src/ResourceModel scaffold round-trip over every
      # project extension, references/combos/localization lists and the
      # per-stats-type comparator with its planted-unknown abort path.
      - name: Resource model tier
        if: inputs.full == true
        run: zig build test-resource-model -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # S04 slice gate: the resource bridge through the engine (Project+Tree,
      # geometry, export, references, preview), on lavapipe.
      - name: Resource bridge tier
        env:
          BK_REQUIRE_ENGINE: "1"
        # The step compiles the whole engine-hosted tree as debug before it
        # runs; the full job's earlier tiers warm the cache on the host, but a
        # fast run (the default here) pays the cold build itself - measured
        # 37+ minutes on the 2026-10-12 runners while the same step ran in
        # under 15 warm (run 38254519207: the 2700 s bound killed it with
        # zero output). 6000 s keeps the silent in-process stall bounded
        # while leaving headroom for a cold build like that one.
        run: timeout 6000 zig build test-resource-bridge -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # The fast run skips the full job's warmup tiers, so its own build pays
      # the cold cost every time unless the tree is saved back: whatever this
      # job compiled leaves the entry warm for the next push, and the cache
      # key is the same hash the restores name. cross-platform.yml saves this
      # entry from main only, so the failing-tier loop owns it here.
      - name: Save the failing-tier Zig build cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-build-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}

      - name: Save the failing-tier Unix Zig global cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-x86_64-linux-gnu-zig-global-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/zig/*.zig', 'Sources/src/StreamIOZig/**/*.zig') }}

      # S17 (D053): the third-party mod round trip. Over the tracked mini-mod here; a real mod needs -Dmod-root.
      - name: Resource mod round-trip tier
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build test-resource-mod-roundtrip -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      # The Resource Editor's own tiers, the engine hidden on the virtual display, as on Windows and macOS.
      - name: Resource editor install
        if: inputs.full == true
        run: zig build install-resource-editor -Dtarget=x86_64-linux-gnu

      - name: Resource editor host
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-host-check -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor smoke
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-smoke -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor batch
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-batch -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto core
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-core -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto wpn
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-wpn -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto unt
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-unt -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto spt
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-spt -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto msh
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-msh -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto obt
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-obt -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto fnc
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-fnc -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto bld
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-bld -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto bdg
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-bdg -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto pcp
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-pcp -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto eff
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-eff -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto til
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-til -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto 3rd
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-3rd -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto 3rv
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-3rv -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto mip
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-mip -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto chc
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-chc -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto cgc
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-cgc -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto mdc
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-mdc -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Resource editor auto gui
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-auto-gui -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Game reads the Resource Editor's exports
        if: inputs.full == true
        env:
          BK_REQUIRE_ENGINE: "1"
        run: zig build resource-editor-game-reads-it -Dtarget=x86_64-linux-gnu -Dtest-mode=run

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-resource-editor-outputs
          path: |
            zig-out
            !zig-out/**/Data/**
            !zig-out/packages/**
          if-no-files-found: ignore